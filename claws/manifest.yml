    install_template: manual-shell
    install_plan_source: "template:manual-shell"
    license: "MIT"
    binary_size_mb: 0  # TBD
    min_ram_mb: 512
    install:
      # rt-claw uses Meson + libcurl. The Ubuntu 24.04 apt packages ship libcurl4
      # but pkg-config is not installed by default — meson finds libcurl via pkgconfig,
      # so we must also install pkg-config or the dependency lookup fails.
      # Builds the linux OSAL target (platform/linux/rtclaw) and installs to PATH.
      manual_script: |
        set -euxo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y git meson ninja-build gcc libcurl4-openssl-dev ca-certificates pkg-config
        git clone https://github.com/zevorn/rt-claw.git /opt/rt-claw
        cd /opt/rt-claw
        git checkout 5811922c4886cb5e90a5908fff792665e913ca48
        test "$(git rev-parse HEAD)" = "5811922c4886cb5e90a5908fff792665e913ca48"
        meson setup build/linux -Dosal=linux
        meson compile -C build/linux
        install -m755 build/linux/platform/linux/rtclaw /usr/local/bin/rt-claw
      entry_point: "rt-claw"

