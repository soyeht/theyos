      # OPENAI_API_KEY is required at runtime — verify soak will crash without it.
      manual_script: |
        set -euxo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y git python3 python3-pip python3-venv nodejs npm
        mkdir -p /opt
        git clone https://github.com/brendanhogan/hermitclaw.git /opt/hermitclaw
        cd /opt/hermitclaw
        git checkout 2b69414969e66702f4aad50e0b09594cc26ccd11
        test "$(git rev-parse HEAD)" = "2b69414969e66702f4aad50e0b09594cc26ccd11"
        pip3 install --break-system-packages -e .
        cd frontend && npm install && npm run build && cd ..
        cat > /usr/local/bin/hermitclaw <<'SHIM'
        #!/bin/bash
        export OPENAI_API_KEY="${OPENAI_API_KEY:-sk-verify-placeholder}"
        cd /opt/hermitclaw && exec python3 hermitclaw/main.py "$@"
        SHIM
        chmod +x /usr/local/bin/hermitclaw

