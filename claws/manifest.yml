# theyOS Claw Manifest — canonical source of truth for all supported claw types.
#
# This file defines every claw that theyOS knows about. At compile time, build.rs
# in core-rs reads this file and generates:
#   - core_rs::manifest::CATALOG (compiled-in Rust const)
#   - claws/catalog.json (for frontend runtime)
#
# Fields used by the claw store (admin panel):
#   name:          claw type identifier (the YAML key)
#   description:   human-readable description shown in the UI
#   language:      primary language/runtime (go, rust, python, node, zig)
#   buildable:     true if the Rust codebase has a get_plan() entry for golden builds
#
# Other fields are used by the build pipeline (imagebuilder, installer plans, etc.)
# but are NOT consumed by the claw store UI.

claws:
  picoclaw:
    description: "Go-based lightweight AI assistant"
    tier: supported
    stars: 28100
    install_plan_source: "builtin"
    language: go
    buildable: true
    distribution: prebuilt
    version: "0.2.5"
    binary_size_mb: 30
    min_ram_mb: 256
    license: "MIT"
    source_type: git
    source: https://github.com/sipeed/picoclaw
    ref: main
    install_cmd: "make deps && make build"
    binary_path: "build/picoclaw-linux-amd64"
    run_cmd: "picoclaw gateway"
    health_cmd: "curl -sf http://localhost:{PORT}/health || picoclaw status"
    config_path: "/root/.picoclaw/config.json"
    workspace_path: "/root/.picoclaw/workspace"
    system_deps:
      - golang-go
      - git
      - make
    language_runtime: go
    fallback_binary: "PICOCLAW_BINARY"

