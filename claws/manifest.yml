  claw-empire:
    description: "Command Your AI Agent Empire from the CEO Desk — A local-first AI agent office simulator that orchestrates CLI, OAuth, and API-connected agents (Claude Code, Codex CLI, Gemini CLI, OpenCode, and more) as a virtual autonomous company."
    language: node
    tier: available
    stars: 1073
    source: "https://github.com/GreenSheep01201/claw-empire"
    last_updated: "2026-03-16"
    reviewed_upstream_commit: "66a24ea7df2435ef897c48c147deb7ec572c01c2"
    reviewed_at: "2026-04-14"
    reviewed_by: claude-opus-4-6
    latest_upstream_commit: "66a24ea7df2435ef897c48c147deb7ec572c01c2"
    latest_checked_at: "2026-04-14"
    install_template: manual-shell
    install_plan_source: "template:manual-shell"
    license: "Apache-2.0"
    binary_size_mb: 0  # TBD
    min_ram_mb: 2048
    install:
      # Node 22+ + pnpm. pnpm install / pnpm run build / tsx server serves
      # on port 8800. Upstream Dockerfile also globally installs
      # @anthropic-ai/claude-code, @openai/codex, @google/gemini-cli,
      # opencode-ai — those are runtime deps for the orchestrator; we
      # install them too so the server doesn't crash on boot.
      manual_script: |
        set -euxo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y apt-transport-https ca-certificates curl gnupg
        mkdir -p /usr/share/keyrings
        rm -f /usr/share/keyrings/nodesource.gpg /etc/apt/sources.list.d/nodesource.list /etc/apt/sources.list.d/nodesource.sources
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key -o /tmp/nodesource-repo.gpg.key
        gpg --dearmor -o /usr/share/keyrings/nodesource.gpg /tmp/nodesource-repo.gpg.key
        rm -f /tmp/nodesource-repo.gpg.key
        chmod 644 /usr/share/keyrings/nodesource.gpg
        ARCH=$(dpkg --print-architecture)
        case "$ARCH" in amd64|arm64) ;; *) echo "Unsupported NodeSource architecture: $ARCH" >&2; exit 1 ;; esac
        printf 'Package: nodejs\nPin: origin deb.nodesource.com\nPin-Priority: 600\n' > /etc/apt/preferences.d/nodejs
        printf 'Types: deb\nURIs: https://deb.nodesource.com/node_22.x\nSuites: nodistro\nComponents: main\nArchitectures: %s\nSigned-By: /usr/share/keyrings/nodesource.gpg\n' "$ARCH" > /etc/apt/sources.list.d/nodesource.sources
        apt-get update
        apt-get install -y git nodejs
        npm install -g pnpm @anthropic-ai/claude-code @openai/codex @google/gemini-cli opencode-ai
        mkdir -p /opt
        git clone https://github.com/GreenSheep01201/claw-empire.git /opt/claw-empire
        cd /opt/claw-empire
        git checkout 66a24ea7df2435ef897c48c147deb7ec572c01c2
        test "$(git rev-parse HEAD)" = "66a24ea7df2435ef897c48c147deb7ec572c01c2"
        pnpm install --frozen-lockfile
        pnpm run build
        cat > /usr/local/bin/claw-empire <<'SHIM'
        #!/bin/bash
        export HOST="${HOST:-127.0.0.1}"
        export ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY:-sk-verify-placeholder}"
        cd /opt/claw-empire && exec pnpm start "$@"
        SHIM
        chmod +x /usr/local/bin/claw-empire

