  clawwork:
    description: "OpenClaw as Your AI Coworker — AI agents pay for their own tokens and earn income by completing GDPVal tasks, with a React dashboard tracking survival metrics."
    language: python
    tier: available
    stars: 7954
    source: "https://github.com/HKUDS/ClawWork"
    last_updated: "2026-03-03"
    reviewed_upstream_commit: "9c73ac05fdb0bffdb23febdd971eb70f44dd46eb"
    reviewed_at: "2026-04-14"
    reviewed_by: claude-opus-4-6
    latest_upstream_commit: "9c73ac05fdb0bffdb23febdd971eb70f44dd46eb"
    latest_checked_at: "2026-04-14"
    install_template: manual-shell
    install_plan_source: "template:manual-shell"
    license: "MIT"
    binary_size_mb: 0  # TBD
    min_ram_mb: 2048
    install:
      # Ubuntu 24.04 ships PyJWT 2.7.0 via apt; it has no RECORD file so pip
      # cannot uninstall it when requirements.txt pulls a newer version.
      # Using a venv avoids the system-package namespace entirely — clean install
      # with no Debian-managed packages visible.
      # The React dashboard (frontend/) is a separate UI; the FastAPI backend
      # (server.py) runs independently, so we skip the npm build to stay well
      # inside the 1800s SSH install ceiling.
      # Runtime requires OPENAI_API_KEY + E2B_API_KEY; verify injects placeholders.
      manual_script: |
        set -euxo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y git python3 python3-venv
        mkdir -p /opt
        git clone https://github.com/HKUDS/ClawWork.git /opt/clawwork
        cd /opt/clawwork
        git checkout 9c73ac05fdb0bffdb23febdd971eb70f44dd46eb
        test "$(git rev-parse HEAD)" = "9c73ac05fdb0bffdb23febdd971eb70f44dd46eb"
        python3 -m venv /opt/clawwork-venv
        /opt/clawwork-venv/bin/pip install --quiet -r /opt/clawwork/requirements.txt
        cat > /usr/local/bin/clawwork <<'SHIM'
        #!/bin/sh
        export OPENAI_API_KEY="${OPENAI_API_KEY:-sk-verify-placeholder}"
        export E2B_API_KEY="${E2B_API_KEY:-verify-placeholder}"
        cd /opt/clawwork && exec /opt/clawwork-venv/bin/python server.py "$@"
        SHIM
        chmod +x /usr/local/bin/clawwork

