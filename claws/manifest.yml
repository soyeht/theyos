  n8n-claw:
    description: "OpenClaw-inspired autonomous AI agent built entirely in n8n. Adaptive RAG-powered memory, Skills via MCP templates, Expert Agents with delegated sub-agents, proactive task management, media understanding - self-hosted with one setup script"
    language: node
    tier: available
    stars: 377
    source: "https://github.com/freddy-schuetz/n8n-claw"
    last_updated: "2026-04-14"
    reviewed_upstream_commit: "e605c0e4f97f644cb180f9cd915ffd6ab9f3a923"
    reviewed_at: "2026-04-15"
    reviewed_by: claude-sonnet-4-6
    latest_upstream_commit: "e605c0e4f97f644cb180f9cd915ffd6ab9f3a923"
    latest_checked_at: "2026-04-15"
    install_template: manual-shell
    install_plan_source: "template:manual-shell"
    license: "unknown"
    binary_size_mb: 0  # TBD
    min_ram_mb: 512
    install:
      # n8n-claw is a workflow pack that runs inside the n8n automation platform.
      # The n8n CLI is published to npm and installs cleanly via npm -g.
      # Ubuntu Noble ships Node 18 by default; n8n 2.x requires Node 22+, so we
      # install from NodeSource. --legacy-peer-deps suppresses zod peer conflicts
      # in n8n 2.16+ that otherwise block the install.
      # upstream setup.sh is interactive (Telegram token, API key, domain, SSL) so
      # we skip it and install the engine only — workflows are imported at runtime.
      manual_script: |
        set -euxo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y apt-transport-https ca-certificates curl gnupg
        mkdir -p /usr/share/keyrings
        rm -f /usr/share/keyrings/nodesource.gpg /etc/apt/sources.list.d/nodesource.list /etc/apt/sources.list.d/nodesource.sources
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key -o /tmp/nodesource-repo.gpg.key
        gpg --dearmor -o /usr/share/keyrings/nodesource.gpg /tmp/nodesource-repo.gpg.key
        rm -f /tmp/nodesource-repo.gpg.key
        chmod 644 /usr/share/keyrings/nodesource.gpg
        ARCH=$(dpkg --print-architecture)
        case "$ARCH" in amd64|arm64) ;; *) echo "Unsupported NodeSource architecture: $ARCH" >&2; exit 1 ;; esac
        printf 'Package: nodejs\nPin: origin deb.nodesource.com\nPin-Priority: 600\n' > /etc/apt/preferences.d/nodejs
        printf 'Types: deb\nURIs: https://deb.nodesource.com/node_22.x\nSuites: nodistro\nComponents: main\nArchitectures: %s\nSigned-By: /usr/share/keyrings/nodesource.gpg\n' "$ARCH" > /etc/apt/sources.list.d/nodesource.sources
        apt-get update
        apt-get install -y nodejs
        npm install -g n8n --legacy-peer-deps
      entry_point: "n8n"

