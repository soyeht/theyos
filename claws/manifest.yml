    description: "Making AI Assistants Cheap Again!"
    language: c
    tier: available
    stars: 818
    source: "https://github.com/zevorn/rt-claw"
    last_updated: "2026-03-31"
    reviewed_upstream_commit: "5811922c4886cb5e90a5908fff792665e913ca48"
