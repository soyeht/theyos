# THROWAWAY local spike for P0.3-C Tier 2 (Keychain ACL/DR durability evidence).
# Standalone crate (own `[workspace]`) so it does NOT join the admin/rust
# workspace. Not published, not shipped, not part of any release artifact.
[package]
name = "kc-acl-spike"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "kc-acl-spike"
path = "src/main.rs"

[dependencies]
# Same crate the engine uses for macOS generic-password access
# (admin/rust/keystore-rs/src/macos_backend.rs), so the item ACL is created via
# the identical SecItemAdd path.
security-framework = "2"

# Declare an isolated workspace root so the parent repo never adopts this crate.
[workspace]
