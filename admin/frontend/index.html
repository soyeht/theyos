<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>soyeht</title>
    <script>
      (function() {
        var t = localStorage.getItem('soyeht-theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <link rel="preload" href="/fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/JetBrainsMono-Medium.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/JetBrainsMono-Bold.woff2" as="font" type="font/woff2" crossorigin>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Brand-mandated: if JetBrains Mono fails to load, surface it loudly.
      //
      // Timing: @font-face rules live in app.css, which main.tsx imports as a
      // module. Module scripts are deferred, so when this inline script runs
      // during HTML parse there is no @font-face for "JetBrains Mono" yet —
      // calling document.fonts.load() at that point returns an empty match
      // list and falsely fires the banner. Wait for window.load (all module
      // chains resolved, CSS applied) AND document.fonts.ready (no pending
      // FontFace transitions), then verify with document.fonts.check() which
      // is the boolean-return form of the same query.
      (function() {
        if (!document.fonts || !document.fonts.check) return;
        function verify() {
          document.fonts.ready.then(function() {
            var ok = document.fonts.check('1em "JetBrains Mono"')
                  && document.fonts.check('bold 1em "JetBrains Mono"');
            if (ok) return;
            console.error('[brand] JetBrains Mono failed to load — UI is off-brand.');
            var bar = document.createElement('div');
            bar.setAttribute('role', 'alert');
            bar.style.cssText = [
              'position:fixed','top:0','left:0','right:0','z-index:2147483647',
              'background:#ff0033','color:#fff','padding:10px 16px',
              'font:700 14px/1.3 "Comic Sans MS",cursive','text-align:center',
              'box-shadow:0 2px 8px rgba(0,0,0,.35)'
            ].join(';');
            bar.textContent = 'BRAND ERROR: JetBrains Mono did not load. UI is rendering in a fallback font.';
            document.body.appendChild(bar);
          });
        }
        if (document.readyState === 'complete') verify();
        else window.addEventListener('load', verify, { once: true });
      })();
    </script>
  </body>
</html>
