[package]
name    = "mesh-session-runtime-rs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "mesh_session_runtime_rs"
path = "src/lib.rs"

[features]
default = []
# Lane R (@ilia, correction after @zain's measurement): household-rs,
# keystore-rs, AND mesh-session-core-rs are all OPTIONAL here, gated
# behind this crate's own non-default feature. A required (non-optional)
# `keystore-rs = { features = ["mesh-session"] }` would let resolver-2's
# feature unification turn `mesh-session` on for keystore-rs across the
# WHOLE workspace unconditionally, silently making the "feature OFF, this
# surface doesn't exist" RED unprovable. Measured three ways before this
# shape was chosen: `cargo metadata` without `--features` on this crate,
# `cargo tree -e features -i keystore-rs`, and the presence/absence of a
# built `libmesh_session_core_rs*.rmeta` artifact.
mesh-session-runtime = [
    "dep:household-rs",
    "dep:keystore-rs",
    "dep:mesh-session-core-rs",
    "household-rs/mesh-session-runtime",
    "keystore-rs/mesh-session",
]

[dependencies]
household-rs = { workspace = true, optional = true }
keystore-rs  = { workspace = true, optional = true }
mesh-session-core-rs = { path = "../mesh-session-core-rs", optional = true }

[dev-dependencies]
# Compile-time-only, zero runtime cost — proves `TimeSourceUnavailable`
# and `NonceConsumeOutcome` are never interchangeable (ledger_seam.rs),
# same technique and precedent as mesh-session-core-rs's own item-14
# checks this session.
static_assertions = "1"

[lints]
workspace = true
