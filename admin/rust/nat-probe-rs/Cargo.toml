[package]
name    = "nat-probe-rs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "nat_probe_rs"
path = "src/lib.rs"

[[bin]]
name = "nat-probe"
path = "src/main.rs"

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
rand_core  = { workspace = true }
if-addrs   = { workspace = true }
clap       = { version = "4", features = ["derive"] }
anyhow     = "1"

[lints]
workspace = true
