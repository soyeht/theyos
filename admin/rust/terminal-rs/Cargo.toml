[package]
name = "terminal-rs"
version = "0.1.24"
edition.workspace = true
rust-version.workspace = true
description = "Rust implementation of the theyOS terminal manager — in-memory sessions with history cap"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
core-rs = { workspace = true }
pty-process  = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
libc = { workspace = true }
# Direct dep (not just transitive via pty-process) so we can call
# `ptsname()` (feature = "alloc", not enabled by pty-process itself) to
# expose the PTY slave device path as session metadata (E5). Version
# pinned to match the `1.1.4` already resolved in the workspace lockfile
# via pty-process, so this doesn't pull in a second rustix version.
rustix = { version = "1.1.4", features = ["pty", "alloc"] }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "terminal-ipc"
path = "src/bin/terminal_ipc.rs"

[lints]
workspace = true
