[package]
name    = "household-rs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "household_rs"
path = "src/lib.rs"

[features]
default = []

[dependencies]
serde         = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }
tracing       = { workspace = true }
tokio         = { workspace = true }

p256          = { workspace = true }
ecdsa         = { workspace = true }
serde_bytes   = { workspace = true }
blake3        = { workspace = true }
sha2          = { workspace = true }
ciborium      = { workspace = true }
data-encoding = { workspace = true }
zeroize       = { workspace = true }
subtle        = { workspace = true }
mdns-sd       = { workspace = true }
gethostname   = { workspace = true }
qrcode        = { workspace = true }
hex           = { workspace = true }
percent-encoding = { workspace = true }
fs2           = { workspace = true }
rustix        = { version = "0.38", features = ["fs", "process"] }
rand          = "0.8"
base64        = { workspace = true }
core-rs       = { workspace = true }
keystore-rs   = { workspace = true }
store-rs      = { workspace = true }
# S0: the neutral wire mechanics moved out of this crate so the boundary is a
# dependency edge `cargo check` enforces, not a grep. The edge runs THIS way
# only — product depends on neutral, never the reverse.
tunnel-wire-rs = { workspace = true }
ureq          = { workspace = true }
webauthn-rs  = { workspace = true }
webauthn-rs-core = { workspace = true }
openssl      = { workspace = true }
rustls-webpki = { workspace = true }
rustls-pki-types = { workspace = true }
x509-parser = { workspace = true }

# Phase 3 cryptographic primitives
chacha20poly1305 = { workspace = true }
vsss-rs          = { workspace = true }
snow             = { workspace = true }

# Linux keystore (kernel keyring; no DBus runtime dependency)
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true }

# macOS Secure Enclave + Keychain access
[target.'cfg(target_os = "macos")'.dependencies]
security-framework     = { workspace = true }
security-framework-sys = { workspace = true }
core-foundation        = { workspace = true }

[dev-dependencies]
tempfile      = { workspace = true }
tracing-test  = { workspace = true, features = ["no-env-filter"] }
rusqlite      = { workspace = true }
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softpasskey"] }
# RED-R23 (D-1/B-ROSTER-ADAPTER v2, erratum1): a real compile-fail proof
# that PeerExpectation has no production constructor, not a comment
# asserting it. Focused, household-rs-only addition, explicitly authorized
# by @kiana for this purpose — not added to the workspace-wide dependency
# set.
trybuild      = "1"

[lints]
workspace = true
