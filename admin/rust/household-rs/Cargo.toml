[package]
name    = "household-rs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "household_rs"
path = "src/lib.rs"

[features]
default = []
# Lane R (@ilia): exposes the D1 membership-projection surface used by the
# not-yet-landed runtime facade. Mirrors keystore-rs's own `mesh-session`
# feature pattern exactly — household-rs -> mesh-session-core-rs (excluded
# from this workspace, see admin/rust/Cargo.toml) is a legitimate edge,
# household-rs never depends on the facade crate itself.
mesh-session-runtime = ["dep:mesh-session-core-rs"]

[dependencies]
serde         = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }
tracing       = { workspace = true }
tokio         = { workspace = true }

p256          = { workspace = true }
ecdsa         = { workspace = true }
serde_bytes   = { workspace = true }
blake3        = { workspace = true }
sha2          = { workspace = true }
ciborium      = { workspace = true }
data-encoding = { workspace = true }
zeroize       = { workspace = true }
subtle        = { workspace = true }
mdns-sd       = { workspace = true }
gethostname   = { workspace = true }
qrcode        = { workspace = true }
hex           = { workspace = true }
percent-encoding = { workspace = true }
fs2           = { workspace = true }
rand          = "0.8"
base64        = { workspace = true }
core-rs       = { workspace = true }
keystore-rs   = { workspace = true }
store-rs      = { workspace = true }
mesh-session-core-rs = { path = "../mesh-session-core-rs", optional = true }
# S0: the neutral wire mechanics moved out of this crate so the boundary is a
# dependency edge `cargo check` enforces, not a grep. The edge runs THIS way
# only — product depends on neutral, never the reverse.
tunnel-wire-rs = { workspace = true }
ureq          = { workspace = true }
webauthn-rs  = { workspace = true }
webauthn-rs-core = { workspace = true }
openssl      = { workspace = true }
rustls-webpki = { workspace = true }
rustls-pki-types = { workspace = true }
x509-parser = { workspace = true }

# Phase 3 cryptographic primitives
chacha20poly1305 = { workspace = true }
vsss-rs          = { workspace = true }
snow             = { workspace = true }

# Linux keystore (kernel keyring; no DBus runtime dependency)
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true }

# macOS Secure Enclave + Keychain access
[target.'cfg(target_os = "macos")'.dependencies]
security-framework     = { workspace = true }
security-framework-sys = { workspace = true }
core-foundation        = { workspace = true }

[dev-dependencies]
tempfile      = { workspace = true }
tracing-test  = { workspace = true, features = ["no-env-filter"] }
rusqlite      = { workspace = true }
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softpasskey"] }
# RED-R23 (D-1/B-ROSTER-ADAPTER v2, erratum1): a real compile-fail proof
# that PeerExpectation has no production constructor, not a comment
# asserting it. Focused, household-rs-only addition, explicitly authorized
# by @kiana for this purpose — not added to the workspace-wide dependency
# set.
trybuild      = "1"
# Lane R (@ilia, authorized 2026-08-05): unconditionally available for
# TEST builds only (coexists with the optional, `mesh-session-runtime`-
# gated entry in [dependencies] above, which alone governs whether this
# crate is reachable from a normal library build). `test-support` unlocks
# `D1MembershipKey::new_for_test`, needed so this crate's own REDs can
# exercise the real `SealedBinding::from_membership_key` wrapper end to
# end, not just the private `validate_membership_fields` helper — that
# crate's `new` is `pub(crate)`, unreachable from here otherwise. The
# feature-gated test functions that use this stay behind
# `#[cfg(feature = "mesh-session-runtime")]` regardless, so a plain
# `cargo test` (no `--features`) still compiles none of them even though
# this dependency itself is always resolved for test builds.
mesh-session-core-rs = { path = "../mesh-session-core-rs", features = ["test-support"] }

[lints]
workspace = true
