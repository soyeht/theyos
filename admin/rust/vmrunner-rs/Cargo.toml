[package]
name = "vmrunner-rs"
version = "0.1.14"
edition.workspace = true
rust-version.workspace = true
description = "Rust reimplementation of Firecracker VM lifecycle (replaces fc-agent-runtime.sh)"

[[bin]]
name = "vmrunner_ipc"
path = "src/bin/vmrunner_ipc.rs"

[[bin]]
name = "fc-ssh"
path = "src/bin/fc_ssh.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
hyperlocal = { workspace = true }
http-body-util = { workspace = true }
russh = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
libc = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sha2 = { workspace = true }
core-rs = { workspace = true, features = ["async-ipc"] }

[features]
integration_tests = []

[dev-dependencies]
tempfile = { workspace = true }
hyper-util = { workspace = true, features = ["server-auto"] }
tokio = { workspace = true, features = ["net"] }

[lints]
workspace = true
