# Cross.toml — cross-rs configuration for Linux cross-compilation.
#
# Used by `cross build --target <triple>` in make.sh and CI.
# Install: cargo install cross --git https://github.com/cross-rs/cross
#
# Targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu
# Both pin to glibc 2.31 (Ubuntu 20.04 LTS minimum, Debian 11+).
#
# Rationale (R4 in research.md): `cross` provides Docker-based toolchains
# that handle glibc version pinning without requiring zig-cc or native runners.

[build]
pre-build = []

[target.x86_64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-gnu:main"

[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main"

# Phase 0 production images are immutable OCI index digests for cross 0.2.5.
[target.x86_64-unknown-linux-musl]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-musl:0.2.5@sha256:77db671d8356a64ae72a3e1415e63f547f26d374fbe3c4762c1cd36c7eac7b99"

[target.aarch64-unknown-linux-musl]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-musl:0.2.5@sha256:702154f52b2d8091671aa2c84d5582d849f949977228c735ff8462f93cc0e1e4"
