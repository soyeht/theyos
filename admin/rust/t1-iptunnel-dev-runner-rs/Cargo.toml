[package]
name = "t1-iptunnel-dev-runner-rs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "t1-iptunnel-dev-runner"
path = "src/main.rs"

[dependencies]
household-rs = { workspace = true }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rand = "0.8"
serde_json = { workspace = true }
tokio = { workspace = true }
server-rs = { workspace = true, optional = true, features = ["dev_t1_datapath"] }

[features]
default = []
dev_t1_datapath = ["dep:server-rs"]

[lints]
workspace = true
