[package]
name    = "server-rs"
version = "0.1.22"
edition.workspace = true
rust-version.workspace = true
build   = "build.rs"

[lib]
name = "server_rs"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[[bin]]
name = "gen-owner-cert-fixture"
path = "src/bin/gen_owner_cert_fixture.rs"

# Dev-only standalone claw responder for the relay_stream Public smoke. An
# owner-authority bypass fixture, so it is gated at the TARGET level: without
# `dev_claw_share_mint` the bin is ABSENT from the build entirely (compile-time
# wall, consistent with the dev-mint endpoints). It is ALSO env-gated at runtime
# by `THEYOS_RELAY_STREAM_CLAW_DEV=1`.
[[bin]]
name = "relay_stream_claw_dev"
path = "src/bin/relay_stream_claw_dev.rs"
required-features = ["dev_claw_share_mint"]

# Dev-only relay_stream Public smoke helpers. Like `relay_stream_claw_dev`,
# these are gated at the TARGET level: without `dev_claw_share_mint` they are
# ABSENT from the build entirely, keeping them off the normal release surface.
[[bin]]
name = "relay_stream_public_relay"
path = "src/bin/relay_stream_public_relay.rs"
required-features = ["dev_claw_share_mint"]

[[bin]]
name = "relay_stream_relay_dev"
path = "src/bin/relay_stream_relay_dev.rs"
required-features = ["dev_claw_share_mint"]

# Dev-only two-ended T1 IpTunnel Phase 0 claw responder. This target is absent
# from default/product builds; it is a standalone dev binary that supplies
# dev-scoped preflight only after explicit runtime acks.
[[bin]]
name = "t1_iptunnel_claw_dev"
path = "src/bin/t1_iptunnel_claw_dev.rs"
required-features = ["dev_t1_datapath"]

[dependencies]
# Async runtime + HTTP framework
tokio       = { workspace = true }
axum        = { workspace = true }
tower       = { workspace = true }
tower-http  = { workspace = true }
hyper       = { workspace = true }
hyper-util  = { workspace = true }
# Serialization
serde       = { workspace = true }
serde_json  = { workspace = true }

# Observability
tracing             = { workspace = true }
tracing-subscriber  = { workspace = true }

# System
libc         = { workspace = true }

# Shared foundation
core-rs      = { workspace = true, features = ["http", "db"] }

# Internal crates (Phase 1)
session-rs   = { workspace = true }
claw-rs      = { workspace = true }
jobs-rs      = { workspace = true }

# Internal crates (Phase 2)
store-rs        = { workspace = true }
executor-rs     = { workspace = true }

# Phase 1 cryptographic skeleton
household-rs    = { workspace = true }
mdns-sd         = { workspace = true }
gethostname     = { workspace = true }
if-addrs        = { workspace = true }

# Relay/membership landing (Device Nostr-claim path + relay_stream subset):
# - keystore-rs: Noise static-key keystore for the relay_stream responder.
# - nostr-relay-rs: the Device Nostr claim/ack + household-log gossip transport.
# - snow: Noise handshake primitives (also pulled in via household-rs).
keystore-rs     = { workspace = true }
nostr-relay-rs  = { workspace = true }
snow            = { workspace = true }
futures-util    = { workspace = true }

# For inlined ratelimit module
rusqlite        = { workspace = true }
thiserror       = { workspace = true }

# Mobile QR auth tokens
rand            = "0.8"
base64          = { workspace = true }
hex             = { workspace = true }
subtle          = { workspace = true }
qrcode          = { workspace = true }
image           = { workspace = true }
percent-encoding = { workspace = true }

# HTTP client (for Caddy admin API in expose handler)
ureq            = { workspace = true }
# Async HTTP client (for LLM-proxy reverse-proxy + future webhooks)
reqwest         = { workspace = true }

# Internal crates (Phase 3)
terminal-rs  = { workspace = true }
vmrunner-common-rs = { workspace = true }
vmrunner-rs  = { workspace = true }

# Phase 3 machine-join push transport (APNS HTTP/2 client; runtime-gated by THEYOS_PUSH_DISABLED)
a2            = { workspace = true }

# Phase 3 wire types (ByteBuf / serde_bytes integration with the
# household-rs Phase 3 schema)
serde_bytes   = { workspace = true }
zeroize       = { workspace = true }
webauthn-rs   = { workspace = true }

# File uploads
tempfile      = { workspace = true }

# Artifact installation (zstd decompression, SHA-256 verification)
zstd          = { workspace = true }
sha2          = { workspace = true }
hmac          = { workspace = true }
blake3        = { workspace = true }

# Phase 3 transitive deps used directly
pty-process   = { workspace = true }
tokio-stream  = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation        = { workspace = true }
security-framework-sys = { workspace = true }

[dev-dependencies]
axum-test    = { version = "17", features = ["ws"] }
serde_json   = { workspace = true }
p256         = { workspace = true }
tokio        = { workspace = true }
tower        = { workspace = true }
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softpasskey"] }
webauthn-rs-core = { workspace = true }
claw-rs      = { workspace = true }
executor-rs  = { workspace = true }
jobs-rs      = { workspace = true }
tempfile     = { workspace = true }
session-rs   = { workspace = true }
store-rs     = { workspace = true }
terminal-rs  = { workspace = true }
vmrunner-rs  = { workspace = true }

[features]
default = []

# Phase 3 failure-injection harness (T063/T064). Enabling this feature
# compiles in `tokio::sync::Notify`-driven crash points used by
# `e2e-rs/tests/phase3_atomic_rollback.rs`. Production builds MUST NOT
# enable this feature; the gates are also `#[cfg(test)]` so unit tests
# in this crate compile them in unconditionally.
failure-injection = []

# Dev-only claw-share invite mint endpoint. Compiles in a loopback + env-gated
# route that mints a PTY claw-share invite on the LIVE engine for the
# relay_stream smoke, skipping ONLY the caller owner-PoP. It is an
# owner-authorization BYPASS fixture: production/release builds MUST NOT enable
# it; without this feature the handler and its route do not exist.
dev_claw_share_mint = []

# Dev-only per-Claw VPN T1 datapath runner wiring. This compiles standalone
# Fase 0 helpers and never changes the production mount, which remains gated by
# the real #281 preflight record.
dev_t1_datapath = ["dev_claw_share_mint"]

# macOS-only FFI bindings to Apple's dns_sd.h system header. Used by
# `bonjour_impl_dns_sd.rs` to publish/browse via `mDNSResponder` (the
# system mDNS daemon) instead of racing it on UDP 5353 with the
# pure-Rust `mdns-sd` crate. See
# `docs/followup-mdns-sd-macos-publisher.md` for context.
[target.'cfg(target_os = "macos")'.build-dependencies]
bindgen = { workspace = true }

[lints]
workspace = true
