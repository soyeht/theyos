[workspace]
# Standalone crate — intentionally NOT a member of admin/rust's workspace.
# This empty table stops cargo from walking up and attaching to
# admin/rust/Cargo.toml's [workspace] members list, which this crate is not
# (and must not be) part of.

[package]
name = "mesh-session-core-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
snow        = { version = "0.10", default-features = false, features = ["std", "use-curve25519", "use-chacha20poly1305", "use-blake2", "use-sha2", "use-getrandom"] }
p256        = { version = "0.13", default-features = false, features = ["ecdsa", "ecdh", "pkcs8", "std", "arithmetic"] }
ecdsa       = { version = "0.16", features = ["der"] }
ciborium    = "0.2"
zeroize     = { version = "1", features = ["derive"] }
serde       = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
rand_core   = { version = "0.6", features = ["getrandom"] }
thiserror   = "1"

[dev-dependencies]
