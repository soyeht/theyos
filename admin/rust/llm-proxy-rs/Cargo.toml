[package]
name    = "llm-proxy-rs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# Public lib surface so server-rs (and tests) can spawn the proxy in-process
# without going over loopback HTTP.
[lib]
name = "llm_proxy"
path = "src/lib.rs"

[[bin]]
name = "theyos-llm-proxy"
path = "src/bin/theyos-llm-proxy.rs"

[dependencies]
# HTTP server
axum         = { workspace = true }
tower        = { workspace = true }
tower-http   = { workspace = true }
hyper        = { workspace = true }
tokio        = { workspace = true }
async-trait  = { workspace = true }
futures-util = { workspace = true }
bytes        = { workspace = true }

# Upstream HTTP client (async + streaming bodies)
reqwest      = { workspace = true }

# Serde / config
serde        = { workspace = true }
serde_json   = { workspace = true }
toml         = { workspace = true }

# Errors + tracing
thiserror    = { workspace = true }
tracing      = { workspace = true }
tracing-subscriber = { workspace = true }

# Internal crates
core-rs      = { workspace = true }
keystore-rs  = { workspace = true }

# SIGHUP signalling for set-credential (Linux only; cfg-gated). macOS dev
# builds skip libc since launchd handles HUP delivery via `launchctl kill`.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }
# Reuse the `Test client` shape from reqwest for tests.

[lints]
workspace = true
