name: Owner-Present Runtime Gate

# This broad trigger is intentionally separate from cross-repo fixture sync.
# Unrelated Rust source changes must prove that the PRE-EFFECT crossing remains
# closed without depending on a not-yet-landed iOS vendor for a new contract.
on:
  pull_request:
    branches:
      - main
    paths:
      - "admin/rust/server-rs/src/**"
      - "admin/rust/household-rs/src/**"
      - "admin/contracts/mobile-claw-vpn/v1/owner_present_error_wire_v1.json"
      - "admin/contracts/mobile-claw-vpn/v1/owner_present_runtime_activation_v1.json"
      - ".github/scripts/check-mobile-claw-vpn-owner-present-runtime-gate.sh"
      - ".github/scripts/test-mobile-claw-vpn-owner-present-runtime-gate.sh"
      - ".github/workflows/owner-present-runtime-gate.yml"
  push:
    branches:
      - main
    paths:
      - "admin/rust/server-rs/src/**"
      - "admin/rust/household-rs/src/**"
      - "admin/contracts/mobile-claw-vpn/v1/owner_present_error_wire_v1.json"
      - "admin/contracts/mobile-claw-vpn/v1/owner_present_runtime_activation_v1.json"
      - ".github/scripts/check-mobile-claw-vpn-owner-present-runtime-gate.sh"
      - ".github/scripts/test-mobile-claw-vpn-owner-present-runtime-gate.sh"
      - ".github/workflows/owner-present-runtime-gate.yml"
  workflow_dispatch:

jobs:
  runtime-crossing-check:
    name: Owner-present PRE-EFFECT crossing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout theyos
        uses: actions/checkout@v5
        with:
          path: theyos

      - name: Checkout soyeht-ios
        uses: actions/checkout@v5
        with:
          repository: soyeht/soyeht-ios
          path: soyeht-ios
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify owner-present runtime crossing remains closed
        shell: bash
        run: |
          bash theyos/.github/scripts/test-mobile-claw-vpn-owner-present-runtime-gate.sh
          bash theyos/.github/scripts/check-mobile-claw-vpn-owner-present-runtime-gate.sh \
            theyos soyeht-ios
