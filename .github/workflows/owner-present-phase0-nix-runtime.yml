name: Owner-Present Phase 0 Nix Runtime

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix-runtime:
    name: Nix runtime Phase 0 contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Install pinned Nix
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27

      - name: Verify locked Nix inputs and build runtime
        id: build
        shell: bash
        run: |
          set -euo pipefail
          test -f flake.lock
          test -f nix/packages/rust-workspace.nix
          export NIX_CONFIG=$'experimental-features = nix-command flakes\n'
          nix flake archive --json --no-write-lock-file . > phase0-nix-input-closure.json
          export NIX_CONFIG=$'experimental-features = nix-command flakes\nsubstituters =\ntrusted-public-keys =\n'
          OUT_PATH="$(nix build --offline --no-link --no-write-lock-file .#theyos-runtime --print-out-paths)"
          test -x "$OUT_PATH/bin/server"
          test -x "$OUT_PATH/bin/theyos-llm-proxy"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          test "$(sha256sum flake.lock | awk '{print $1}')" = \
            "$(jq -r '.flake_lock_sha256' "$OUT_PATH/phase0-runtime-manifest.json")"
          jq -e '
            .artifact_contract == "all-published-nix-executables-v1"
            and (.executables | type == "object" and has("server") and has("theyos-llm-proxy"))
            and all(.executables[]; (.sha256 | test("^[0-9a-f]{64}$")))
          ' "$OUT_PATH/phase0-runtime-manifest.json" >/dev/null
          while IFS=$'\t' read -r executable expected classification; do
            case "$executable" in
              ''|*/*|*..*)
                echo "invalid Nix runtime executable name: $executable" >&2
                exit 1
                ;;
            esac
            test -x "$OUT_PATH/bin/$executable"
            test "$(sha256sum "$OUT_PATH/bin/$executable" | awk '{print $1}')" = "$expected"
            test -n "$classification"
          done < <(jq -r '.executables | to_entries[] | [.key,.value.sha256,.value.classification] | @tsv' "$OUT_PATH/phase0-runtime-manifest.json")
          "$OUT_PATH/bin/server" --owner-present-phase0-contract \
            | jq -e '
              .authority == "none"
              and .production_activation == false
              and .third_target_injection_seam_compiled == false
              and .generic_ip_tunnel_backend_compiled == false
              and .generic_ip_tunnel_store_accepts_resource == false
              and .generic_ip_tunnel_env_accepts_resource == false
              and .declared_product_a_routes == ["/claw-vpn/status"]
            ' >/dev/null
          "$OUT_PATH/bin/theyos-llm-proxy" --owner-present-phase0-contract \
            | jq -e '
              .authority == "none"
              and .production_activation == false
              and .allowed_requests == [
                {"method":"GET","path":"/api/v1/mobile/claw-vpn/status"},
                {"method":"HEAD","path":"/api/v1/mobile/claw-vpn/status"}
              ]
            ' >/dev/null
          nix path-info --recursive --json "$OUT_PATH" > phase0-nix-store-closure.json
          CLOSURE_SHA256="$(sha256sum phase0-nix-store-closure.json | awk '{print $1}')"
          INPUT_CLOSURE_SHA256="$(sha256sum phase0-nix-input-closure.json | awk '{print $1}')"
          jq -S \
            --arg source_sha "$GITHUB_SHA" \
            --arg source_tree "$SOURCE_TREE" \
            --arg closure_sha256 "$CLOSURE_SHA256" \
            --arg input_closure_sha256 "$INPUT_CLOSURE_SHA256" \
            '. + {source_sha:$source_sha,source_tree:$source_tree,nix_store_closure_manifest_sha256:$closure_sha256,nix_input_closure_manifest_sha256:$input_closure_sha256,nix_build_offline:true,nix_substituters_closed:true}' \
            "$OUT_PATH/phase0-runtime-manifest.json" > phase0-runtime-manifest.json
          STAGE="$RUNNER_TEMP/phase0-nix-runtime"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -a "$OUT_PATH" "$STAGE/runtime"
          cp phase0-runtime-manifest.json phase0-nix-input-closure.json phase0-nix-store-closure.json "$STAGE/"
          tar -C "$STAGE" -czf phase0-nix-runtime.tar.gz .

      - name: Upload Nix runtime subject
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: owner-present-phase0-nix-runtime
          path: |
            phase0-nix-runtime.tar.gz
            phase0-runtime-manifest.json
            phase0-nix-input-closure.json
            phase0-nix-store-closure.json
          if-no-files-found: error

  attest-nix-runtime:
    name: Attest final Nix runtime subject
    if: github.event_name == 'push'
    needs: nix-runtime
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download final Nix subject
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: owner-present-phase0-nix-runtime

      - name: Attest final Nix subject
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: phase0-nix-runtime.tar.gz
