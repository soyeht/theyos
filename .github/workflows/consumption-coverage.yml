name: Consumption Coverage

# Phase 3.1 of the CI plan: close the "consumed-but-not-compiled" false green.
# backend-ci.yml only runs on a fixed paths list; on any other PR the docs-shim
# publishes the same required check names green WITHOUT compiling. So a Rust
# `include_str!("PORTS.md")` edited via a docs-only PR is never re-checked, and
# a green PR can merge a broken main. This gate fails when the build consumes a
# repo file a change to it would NOT cause backend-ci to run.
#
# Like Repo Hygiene, this is DELIBERATELY NOT A REQUIRED CHECK on day one: it is
# red against `main` today (real, known holes -- PORTS.md and four others), and
# making it required immediately would block every PR or get switched off within
# a week. It reports first. Promotion to required happens once its findings are
# at zero, as its own reviewed change.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "23 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consumption-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Consumption coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout theyos
        uses: actions/checkout@v5
        # This gate reads file contents only (no git history), so a shallow
        # clone is sufficient and faster than Repo Hygiene's fetch-depth: 0.
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # continue-on-error per step + a summary + a final fail step: one signal
      # going red must not hide the other, and a gate that cannot show red is
      # not a gate. Mirrors Repo Hygiene on purpose.
      - name: Gate — consumption coverage
        id: coverage
        continue-on-error: true
        run: uv run scripts/check_consumption_coverage.py

      - name: Gate self-tests
        id: selftest
        continue-on-error: true
        run: uv run scripts/test_check_consumption_coverage.py

      - name: Summary
        if: always()
        run: |
          {
            echo "| gate | outcome |"
            echo "|---|---|"
            echo "| consumption coverage | ${{ steps.coverage.outcome }} |"
            echo "| coverage self-tests | ${{ steps.selftest.outcome }} |"
            echo ""
            echo "This job is NOT a required check, so a red here reports rather than blocks."
            echo "RED = a consumed file the backend paths do not cover (false-green class)."
            echo "DECLARED = a consumption class static analysis cannot prove uncovered"
            echo "(read_dir / runtime-built / test-targets-CI-doesn't-build); listed, never silent."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the job if a gate went red
        if: always()
        run: |
          failed=""
          [ "${{ steps.coverage.outcome }}" = "failure" ] && failed="${failed} consumption-coverage"
          [ "${{ steps.selftest.outcome }}" = "failure" ] && failed="${failed} consumption-coverage-selftests"
          if [ -n "${failed}" ]; then
            echo "::error::red gates:${failed} — see the step logs and the job summary. This check is not required; it reports."
            exit 1
          fi
          echo "coverage gate + self-tests green"
