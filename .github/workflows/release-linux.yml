name: Release (Linux)

# Triggered alongside release-macos.yml on `v*` tag pushes. The manual
# recovery path publishes the already-built subjects from a named prior run;
# it never rebuilds a historical tag from the default branch.
# Builds Linux engine binaries for x86_64 and aarch64 via the pinned OCI recipe,
# packages each into tar.gz + sha256, and uploads to the GitHub Release.
#
# Smoke-tests the binary boots in a minimal Alpine container.
#
# Prereqs: GitHub Release must already exist (created by release-macos.yml,
# which runs first because it also does the notarization). This workflow
# just adds the Linux assets to the existing release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing prerelease tag that owns the recovered assets
        required: true
        type: string
      source_sha:
        description: Exact commit resolved by release_tag and bound by provenance
        required: true
        type: string
      source_run_id:
        description: Prior Release Linux run containing the attested subjects
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-linux-x86_64:
    name: Build Linux (x86_64)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TAG: ${{ github.ref_name }}
      CARGO_TARGET: x86_64-unknown-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Verify landed tag ancestry
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Isolate Phase 0 Rust toolchain
        shell: bash
        run: |
          phase0_home="${RUNNER_TEMP}/phase0-rust-home"
          rm -rf "${phase0_home}"
          install -d -m 700 "${phase0_home}"
          printf 'HOME=%s\n' "${phase0_home}" >> "${GITHUB_ENV}"
          printf 'RUSTUP_HOME=%s/.rustup\n' "${phase0_home}" >> "${GITHUB_ENV}"
          printf 'CARGO_HOME=%s/.cargo\n' "${phase0_home}" >> "${GITHUB_ENV}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@5a814b2e0f75e492da42a3c1227d52112e4dac50 # 1.92.0
        with:
          components: clippy
          targets: x86_64-unknown-linux-musl

      - name: Build (release)
        run: |
          PHASE0_ATTESTATION="$RUNNER_TEMP/phase0-attestation-x86_64-unknown-linux-musl.json"
          PHASE0_ENGINE="$RUNNER_TEMP/phase0-engine-x86_64/theyos-engine"
          mkdir -p "$(dirname "$PHASE0_ENGINE")"
          env -u CARGO_HOME -u RUSTUP_HOME -u PHASE0_RUSTUP_HOME PHASE0_TARGET=x86_64-unknown-linux-musl \
          PHASE0_BUILD_TOOL=cross \
          PHASE0_CARGO_TARGET_DIR="$RUNNER_TEMP/phase0-target-x86_64" \
          PHASE0_RUN_ARTIFACT_DIRECT=1 \
          PHASE0_ATTESTATION_OUT="$PHASE0_ATTESTATION" \
          PHASE0_STAGED_ENGINE_OUT="$PHASE0_ENGINE" \
            bash .github/scripts/check-mobile-claw-vpn-owner-present-phase0-compileout.sh
          echo "phase0_attestation=$PHASE0_ATTESTATION" >> "$GITHUB_ENV"
          echo "phase0_engine=$PHASE0_ENGINE" >> "$GITHUB_ENV"

      - name: Package + sha256
        working-directory: admin/rust
        run: |
          set -e
          CARGO_VERSION=$(git show "$GITHUB_SHA:admin/rust/soyeht-rs/Cargo.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          OUTDIR="$RUNNER_TEMP/linux-package-x86_64"
          STAGE="$OUTDIR/stage"
          mkdir -p "$OUTDIR"
          mkdir -p "$STAGE"
          BINARY_DIR="$RUNNER_TEMP/phase0-target-x86_64/x86_64-unknown-linux-musl/release"
          BINARY="$BINARY_DIR/server"
          TARBALL="$OUTDIR/theyos-engine-${CARGO_VERSION}-linux-x86_64.tar.gz"
          cp "$phase0_engine" "$STAGE/theyos-engine"
          test -x "$STAGE/theyos-engine"
          test "$(sha256sum "$STAGE/theyos-engine" | awk '{print $1}')" = \
            "$(jq -r '.theyos_engine_sha256' "$phase0_attestation")"
          cp "$BINARY_DIR/soyeht" "$STAGE/soyeht"
          cp "$BINARY_DIR/vmrunner_ipc" "$STAGE/vmrunner_ipc"
          cp "$BINARY_DIR/fc-ssh" "$STAGE/fc-ssh"
          cp "$BINARY_DIR/store-ipc" "$STAGE/store-ipc"
          cp "$BINARY_DIR/terminal-ipc" "$STAGE/terminal-ipc"
          cp "$BINARY_DIR/imagebuilder" "$STAGE/imagebuilder"
          git show "$GITHUB_SHA:scripts/uninstall-linux.sh" > "$STAGE/uninstall-linux.sh"
          chmod +x "$STAGE/soyeht" "$STAGE/uninstall-linux.sh"
          printf '%s\n' "$CARGO_VERSION" > "$STAGE/engine-version.txt"
          for executable in theyos-engine soyeht vmrunner_ipc fc-ssh store-ipc terminal-ipc imagebuilder; do
            actual="$(sha256sum "$STAGE/$executable" | awk '{print $1}')"
            expected="$(jq -r --arg executable "$executable" '.published_executables[$executable].sha256' "$phase0_attestation")"
            test "$actual" = "$expected"
          done
          uninstall_sha256="$(sha256sum "$STAGE/uninstall-linux.sh" | awk '{print $1}')"
          jq -n -S \
            --arg sha256 "$uninstall_sha256" \
            '{schema:"theyos-phase0-package-files-v1",files:{"uninstall-linux.sh":{sha256:$sha256,classification:"published-installer-script-no-owner-authority"}}}' \
            > "$STAGE/phase0-package-files.json"
          tar czf "$TARBALL" -C "$STAGE" .
          sha256sum "$TARBALL" > "${TARBALL}.sha256"
          RELEASE_PROVENANCE="$OUTDIR/theyos-engine-${CARGO_VERSION}-linux-x86_64.provenance.json"
          jq -n -S \
            --arg schema "theyos-engine-release-provenance-v1" \
            --arg source_sha "$(git -C ../.. rev-parse HEAD)" \
            --arg target "x86_64-unknown-linux-musl" \
            --arg engine_sha256 "$(sha256sum "$STAGE/theyos-engine" | awk '{print $1}')" \
            --arg published_executables_sha256 "$(jq -S '.published_executables' "$phase0_attestation" | sha256sum | awk '{print $1}')" \
            --arg phase0_attestation_sha256 "$(sha256sum "$phase0_attestation" | awk '{print $1}')" \
            --arg package_files_sha256 "$(sha256sum "$STAGE/phase0-package-files.json" | awk '{print $1}')" \
            --arg package_sha256 "$(sha256sum "$TARBALL" | awk '{print $1}')" \
            '{schema:$schema,source_sha:$source_sha,target:$target,phase0_engine_sha256:$engine_sha256,published_executables_sha256:$published_executables_sha256,phase0_attestation_sha256:$phase0_attestation_sha256,package_files_sha256:$package_files_sha256,published_package_sha256:$package_sha256}' \
            > "$RELEASE_PROVENANCE"
          SUBJECT_DIR="$RUNNER_TEMP/linux-phase0-subject-x86_64"
          rm -rf "$SUBJECT_DIR"
          mkdir -p "$SUBJECT_DIR"
          cp "$TARBALL" "$TARBALL.sha256" "$RELEASE_PROVENANCE" "$phase0_attestation" "$SUBJECT_DIR/"
          echo "subject_dir=$SUBJECT_DIR" >> "$GITHUB_ENV"
          echo "tarball=$TARBALL" >> "$GITHUB_ENV"
          echo "release_provenance=$RELEASE_PROVENANCE" >> "$GITHUB_ENV"
          echo "version=$CARGO_VERSION" >> "$GITHUB_ENV"

      - name: Smoke-test binary (static musl, x86_64)
        working-directory: admin/rust
        run: |
          set -e
          VERIFY_DIR="$RUNNER_TEMP/verify-linux-x86_64"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          tar xzf "$tarball" -C "$VERIFY_DIR" ./theyos-engine
          BINARY="$VERIFY_DIR/theyos-engine"
          test "$(sha256sum "$BINARY" | awk '{print $1}')" = \
            "$(jq -r '.theyos_engine_sha256' "$phase0_attestation")"
          # --version exits 0 immediately — proves ELF loads, argv is parsed, no linker fault.
          docker run --rm \
            -v "$BINARY:/engine:ro" \
            --entrypoint /engine \
            alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc \
            --version
          docker run --rm \
            -v "$RUNNER_TEMP/phase0-target-x86_64/x86_64-unknown-linux-musl/release/soyeht:/soyeht:ro" \
            --entrypoint /soyeht \
            alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc \
            uninstall --help
          echo "Smoke test passed: x86_64 binary --version exit 0"

      - name: Upload unsigned Linux subject
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-phase0-x86_64
          path: ${{ env.subject_dir }}
          if-no-files-found: error
          retention-days: 30

  build-linux-aarch64:
    name: Build Linux (aarch64)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TAG: ${{ github.ref_name }}
      CARGO_TARGET: aarch64-unknown-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Verify landed tag ancestry
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Isolate Phase 0 Rust toolchain
        shell: bash
        run: |
          phase0_home="${RUNNER_TEMP}/phase0-rust-home"
          rm -rf "${phase0_home}"
          install -d -m 700 "${phase0_home}"
          printf 'HOME=%s\n' "${phase0_home}" >> "${GITHUB_ENV}"
          printf 'RUSTUP_HOME=%s/.rustup\n' "${phase0_home}" >> "${GITHUB_ENV}"
          printf 'CARGO_HOME=%s/.cargo\n' "${phase0_home}" >> "${GITHUB_ENV}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@5a814b2e0f75e492da42a3c1227d52112e4dac50 # 1.92.0
        with:
          components: clippy
          targets: aarch64-unknown-linux-musl

      - name: Cross-compile (release)
        run: |
          PHASE0_ATTESTATION="$RUNNER_TEMP/phase0-attestation-aarch64-unknown-linux-musl.json"
          PHASE0_ENGINE="$RUNNER_TEMP/phase0-engine-aarch64/theyos-engine"
          mkdir -p "$(dirname "$PHASE0_ENGINE")"
          env -u CARGO_HOME -u RUSTUP_HOME -u PHASE0_RUSTUP_HOME PHASE0_TARGET=aarch64-unknown-linux-musl \
          PHASE0_BUILD_TOOL=cross \
          PHASE0_CARGO_TARGET_DIR="$RUNNER_TEMP/phase0-target-aarch64" \
          PHASE0_RUN_ARTIFACT_DIRECT=0 \
          PHASE0_ATTESTATION_OUT="$PHASE0_ATTESTATION" \
          PHASE0_STAGED_ENGINE_OUT="$PHASE0_ENGINE" \
            bash .github/scripts/check-mobile-claw-vpn-owner-present-phase0-compileout.sh
          echo "phase0_attestation=$PHASE0_ATTESTATION" >> "$GITHUB_ENV"
          echo "phase0_engine=$PHASE0_ENGINE" >> "$GITHUB_ENV"

      - name: Package + sha256
        working-directory: admin/rust
        run: |
          set -e
          CARGO_VERSION=$(git show "$GITHUB_SHA:admin/rust/soyeht-rs/Cargo.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          OUTDIR="$RUNNER_TEMP/linux-package-aarch64"
          STAGE="$OUTDIR/stage"
          mkdir -p "$OUTDIR"
          mkdir -p "$STAGE"
          BINARY_DIR="$RUNNER_TEMP/phase0-target-aarch64/aarch64-unknown-linux-musl/release"
          BINARY="$BINARY_DIR/server"
          TARBALL="$OUTDIR/theyos-engine-${CARGO_VERSION}-linux-aarch64.tar.gz"
          cp "$phase0_engine" "$STAGE/theyos-engine"
          test -x "$STAGE/theyos-engine"
          test "$(sha256sum "$STAGE/theyos-engine" | awk '{print $1}')" = \
            "$(jq -r '.theyos_engine_sha256' "$phase0_attestation")"
          cp "$BINARY_DIR/soyeht" "$STAGE/soyeht"
          cp "$BINARY_DIR/vmrunner_ipc" "$STAGE/vmrunner_ipc"
          cp "$BINARY_DIR/fc-ssh" "$STAGE/fc-ssh"
          cp "$BINARY_DIR/store-ipc" "$STAGE/store-ipc"
          cp "$BINARY_DIR/terminal-ipc" "$STAGE/terminal-ipc"
          cp "$BINARY_DIR/imagebuilder" "$STAGE/imagebuilder"
          git show "$GITHUB_SHA:scripts/uninstall-linux.sh" > "$STAGE/uninstall-linux.sh"
          chmod +x "$STAGE/soyeht" "$STAGE/uninstall-linux.sh"
          printf '%s\n' "$CARGO_VERSION" > "$STAGE/engine-version.txt"
          for executable in theyos-engine soyeht vmrunner_ipc fc-ssh store-ipc terminal-ipc imagebuilder; do
            actual="$(sha256sum "$STAGE/$executable" | awk '{print $1}')"
            expected="$(jq -r --arg executable "$executable" '.published_executables[$executable].sha256' "$phase0_attestation")"
            test "$actual" = "$expected"
          done
          uninstall_sha256="$(sha256sum "$STAGE/uninstall-linux.sh" | awk '{print $1}')"
          jq -n -S \
            --arg sha256 "$uninstall_sha256" \
            '{schema:"theyos-phase0-package-files-v1",files:{"uninstall-linux.sh":{sha256:$sha256,classification:"published-installer-script-no-owner-authority"}}}' \
            > "$STAGE/phase0-package-files.json"
          tar czf "$TARBALL" -C "$STAGE" .
          sha256sum "$TARBALL" > "${TARBALL}.sha256"
          RELEASE_PROVENANCE="$OUTDIR/theyos-engine-${CARGO_VERSION}-linux-aarch64.provenance.json"
          jq -n -S \
            --arg schema "theyos-engine-release-provenance-v1" \
            --arg source_sha "$(git -C ../.. rev-parse HEAD)" \
            --arg target "aarch64-unknown-linux-musl" \
            --arg engine_sha256 "$(sha256sum "$STAGE/theyos-engine" | awk '{print $1}')" \
            --arg published_executables_sha256 "$(jq -S '.published_executables' "$phase0_attestation" | sha256sum | awk '{print $1}')" \
            --arg phase0_attestation_sha256 "$(sha256sum "$phase0_attestation" | awk '{print $1}')" \
            --arg package_files_sha256 "$(sha256sum "$STAGE/phase0-package-files.json" | awk '{print $1}')" \
            --arg package_sha256 "$(sha256sum "$TARBALL" | awk '{print $1}')" \
            '{schema:$schema,source_sha:$source_sha,target:$target,phase0_engine_sha256:$engine_sha256,published_executables_sha256:$published_executables_sha256,phase0_attestation_sha256:$phase0_attestation_sha256,package_files_sha256:$package_files_sha256,published_package_sha256:$package_sha256}' \
            > "$RELEASE_PROVENANCE"
          SUBJECT_DIR="$RUNNER_TEMP/linux-phase0-subject-aarch64"
          rm -rf "$SUBJECT_DIR"
          mkdir -p "$SUBJECT_DIR"
          cp "$TARBALL" "$TARBALL.sha256" "$RELEASE_PROVENANCE" "$phase0_attestation" "$SUBJECT_DIR/"
          echo "subject_dir=$SUBJECT_DIR" >> "$GITHUB_ENV"
          echo "tarball=$TARBALL" >> "$GITHUB_ENV"
          echo "release_provenance=$RELEASE_PROVENANCE" >> "$GITHUB_ENV"
          echo "version=$CARGO_VERSION" >> "$GITHUB_ENV"

      - name: Setup QEMU (aarch64 emulation)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Smoke-test binary (static musl, aarch64)
        working-directory: admin/rust
        run: |
          set -e
          VERIFY_DIR="$RUNNER_TEMP/verify-linux-aarch64"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          tar xzf "$tarball" -C "$VERIFY_DIR" ./theyos-engine
          BINARY="$VERIFY_DIR/theyos-engine"
          test "$(sha256sum "$BINARY" | awk '{print $1}')" = \
            "$(jq -r '.theyos_engine_sha256' "$phase0_attestation")"
          # --version exits 0 immediately — proves ELF loads, argv is parsed, no linker fault.
          docker run --rm --platform linux/arm64 \
            -v "$BINARY:/engine:ro" \
            --entrypoint /engine \
            alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc \
            --version
          docker run --rm --platform linux/arm64 \
            -v "$RUNNER_TEMP/phase0-target-aarch64/aarch64-unknown-linux-musl/release/soyeht:/soyeht:ro" \
            --entrypoint /soyeht \
            alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc \
            uninstall --help
          echo "Smoke test passed: aarch64 binary --version exit 0"

      - name: Upload unsigned Linux subject
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-phase0-aarch64
          path: ${{ env.subject_dir }}
          if-no-files-found: error
          retention-days: 30

  publish-linux:
    name: Attest and publish Linux subjects (${{ matrix.target }})
    if: >-
      always() &&
      ((github.event_name == 'push' &&
        needs.build-linux-x86_64.result == 'success' &&
        needs.build-linux-aarch64.result == 'success') ||
       github.event_name == 'workflow_dispatch')
    needs:
      - build-linux-x86_64
      - build-linux-aarch64
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: linux-phase0-x86_64
          - target: aarch64-unknown-linux-musl
            artifact: linux-phase0-aarch64
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.run_id }}
    steps:
      - name: Download immutable Linux subject
        if: github.event_name == 'push'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.artifact }}
          path: subject

      - name: Download immutable Linux recovery subject
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.artifact }}
          path: subject
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify subject before publication
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$SOURCE_SHA"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" = true
            gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" |
              jq -e \
                --arg repository "$GH_REPO" \
                --arg workflow ".github/workflows/release-linux.yml" \
                --arg tag "$TAG" \
                --arg source_sha "$SOURCE_SHA" '
                  .repository.full_name == $repository
                  and .path == $workflow
                  and .event == "push"
                  and .head_branch == $tag
                  and .head_sha == $source_sha
                  and .conclusion == "failure"
                ' >/dev/null
          fi
          version="${TAG#v}"
          case "$TARGET" in
            x86_64-unknown-linux-musl) release_arch=x86_64 ;;
            aarch64-unknown-linux-musl) release_arch=aarch64 ;;
            *) echo "::error::unsupported Linux release target $TARGET"; exit 1 ;;
          esac
          tarball="subject/theyos-engine-$version-linux-$release_arch.tar.gz"
          checksum="$tarball.sha256"
          provenance="subject/theyos-engine-$version-linux-$release_arch.provenance.json"
          phase0="subject/phase0-attestation-$TARGET.json"
          test -f "$tarball" -a -f "$checksum" -a -f "$provenance" -a -f "$phase0"
          test "$(find subject -maxdepth 1 -type f | wc -l | tr -d ' ')" = 4
          test "$(tar -xOzf "$tarball" ./engine-version.txt)" = "$version"
          test "$(jq -r '.source_sha' "$provenance")" = "$SOURCE_SHA"
          test "$(jq -r '.target' "$provenance")" = "$TARGET"
          test "$(jq -r '.published_package_sha256' "$provenance")" = "$(sha256sum "$tarball" | awk '{print $1}')"
          test "$(jq -r '.source_sha' "$phase0")" = "$SOURCE_SHA"
          test "$(jq -r '.target' "$phase0")" = "$TARGET"
          expected_checksum="$(awk 'NR == 1 { print $1 }' "$checksum")"
          [[ "$expected_checksum" =~ ^[0-9a-f]{64}$ ]]
          test "$(wc -l < "$checksum" | tr -d ' ')" = 1
          test "$expected_checksum" = "$(sha256sum "$tarball" | awk '{print $1}')"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # A failed source run proves neither that this subject reached the
            # attestation step nor that its digest has a valid repository
            # attestation. Recovery must establish that fact directly.
            gh attestation verify "$tarball" --repo "$GH_REPO"
          fi

      - name: Attest final Linux package
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: subject/*.tar.gz

      - name: Upload final Linux package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$SOURCE_SHA"
          for i in $(seq 1 90); do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            sleep 10
          done
          gh release view "$TAG" >/dev/null
          test "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" = true
          gh release upload "$TAG" subject/* --clobber
