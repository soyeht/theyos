name: Release (Linux)

# Triggered alongside release-macos.yml on `v*` tag pushes.
# Builds Linux engine binaries for x86_64 and aarch64 via `cross`,
# packages each into tar.gz + sha256, and uploads to the GitHub Release.
#
# Smoke-tests the binary boots in a minimal Alpine+glibc container.
#
# Prereqs: GitHub Release must already exist (created by release-macos.yml,
# which runs first because it also does the notarization). This workflow
# just adds the Linux assets to the existing release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.10). Must already exist."
        required: true

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TAG: ${{ github.ref_name || github.event.inputs.tag }}
      CARGO_TARGET: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "admin/rust -> target"
          shared-key: "release-linux-x86_64"

      - name: Cross-compile (release)
        working-directory: admin/rust
        run: |
          cross build \
            --target x86_64-unknown-linux-gnu \
            --release \
            -p server-rs

      - name: Package + sha256
        working-directory: admin/rust
        run: |
          set -e
          CARGO_VERSION=$(grep '^version' soyeht-rs/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          OUTDIR="dist/linux-x86_64"
          mkdir -p "$OUTDIR"
          BINARY="target/x86_64-unknown-linux-gnu/release/server-rs"
          TARBALL="$OUTDIR/theyos-engine-${CARGO_VERSION}-linux-x86_64.tar.gz"
          tar czf "$TARBALL" -C "$(dirname "$BINARY")" "$(basename "$BINARY")"
          sha256sum "$TARBALL" > "${TARBALL}.sha256"
          echo "tarball=$TARBALL" >> "$GITHUB_ENV"
          echo "version=$CARGO_VERSION" >> "$GITHUB_ENV"

      - name: Smoke-test binary (glibc, x86_64)
        working-directory: admin/rust
        run: |
          set -e
          BINARY="target/x86_64-unknown-linux-gnu/release/server-rs"
          # --version exits 0 immediately — proves ELF loads, argv is parsed, no linker fault.
          docker run --rm \
            -v "$(pwd)/$BINARY:/engine" \
            --entrypoint /engine \
            debian:stable-slim \
            --version
          echo "Smoke test passed: x86_64 binary --version exit 0"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" \
            "admin/rust/${{ env.tarball }}#theyos-engine-${{ env.version }}-linux-x86_64.tar.gz" \
            "admin/rust/${{ env.tarball }}.sha256#theyos-engine-${{ env.version }}-linux-x86_64.tar.gz.sha256" \
            --clobber

  build-linux-aarch64:
    name: Build Linux (aarch64)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TAG: ${{ github.ref_name || github.event.inputs.tag }}
      CARGO_TARGET: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "admin/rust -> target"
          shared-key: "release-linux-aarch64"

      - name: Cross-compile (release)
        working-directory: admin/rust
        run: |
          cross build \
            --target aarch64-unknown-linux-gnu \
            --release \
            -p server-rs

      - name: Package + sha256
        working-directory: admin/rust
        run: |
          set -e
          CARGO_VERSION=$(grep '^version' soyeht-rs/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          OUTDIR="dist/linux-aarch64"
          mkdir -p "$OUTDIR"
          BINARY="target/aarch64-unknown-linux-gnu/release/server-rs"
          TARBALL="$OUTDIR/theyos-engine-${CARGO_VERSION}-linux-aarch64.tar.gz"
          tar czf "$TARBALL" -C "$(dirname "$BINARY")" "$(basename "$BINARY")"
          sha256sum "$TARBALL" > "${TARBALL}.sha256"
          echo "tarball=$TARBALL" >> "$GITHUB_ENV"
          echo "version=$CARGO_VERSION" >> "$GITHUB_ENV"

      - name: Setup QEMU (aarch64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Smoke-test binary (glibc, aarch64)
        working-directory: admin/rust
        run: |
          set -e
          BINARY="target/aarch64-unknown-linux-gnu/release/server-rs"
          # --version exits 0 immediately — proves ELF loads, argv is parsed, no linker fault.
          docker run --rm --platform linux/arm64 \
            -v "$(pwd)/$BINARY:/engine" \
            --entrypoint /engine \
            debian:stable-slim \
            --version
          echo "Smoke test passed: aarch64 binary --version exit 0"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" \
            "admin/rust/${{ env.tarball }}#theyos-engine-${{ env.version }}-linux-aarch64.tar.gz" \
            "admin/rust/${{ env.tarball }}.sha256#theyos-engine-${{ env.version }}-linux-aarch64.tar.gz.sha256" \
            --clobber
