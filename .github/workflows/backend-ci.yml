        uses: astral-sh/setup-uv@v5
      - name: Excluded workspace members (mesh-session core + control model)
        # These two crates are in `[workspace] exclude`, so the step above does
        # not reach them. Precisely: NOTHING invoked `cargo test` on either one.
        # They are not unreferenced — `admin/rust/scripts/graph-gate/run_gate.sh`
        # names both and enters their standalone workspaces — but its phase 4 runs
        # `cargo check --offline --all-targets`, which COMPILES the tests and
        # executes none of them. A feature-gated dependent likewise compiles the
        # crate; cargo does not run a dependency's tests.
        #
        # So ~206 Noise protocol tests and the control model's cross-process CAS
        # passed locally and never in automation. That is evidence debt, not
        # coverage debt: the decision to keep this stack rests on exactly the
        # coverage that was not executing.
        #
        # Both runners on purpose. The control model's CAS is built on
        # `std::fs::File::lock`, whose behaviour is platform-specific, so a
        # Linux-only run would leave the macOS host it also ships on uncovered.
        #
        # The control model needs BOTH invocations, and the first alone is
        # vacuous. Its two integration targets declare
        # `required-features = ["test-support", "roster-sync-unratified"]`, so a
        # plain `cargo test` there runs 0 unit tests and 0 integration tests —
        # only the 13 doctests. Measured: with `replace_exact` mutated to return
        # `KnownNoEffect` unconditionally (a CAS that never writes), the plain
        # command still exits 0 and the feature-gated one exits 101 with all four
        # `cas_multiprocess` tests failing.
        #
        # The plain run is NOT redundant and must not be replaced by the gated
        # one: `src/lib.rs` carries `compile_fail` doctests proving the gated
        # surface is absent by default. Turn the features on and those snippets
        # compile, so the doctest fails its own "must not compile" check —
        # measured, 5 doctest failures. Hence the second invocation selects
        # targets explicitly and runs no doctests.
        #
        # `--locked` verified against both standalone lockfiles before landing.
        #
        # THEYOS_REQUIRE_NOISE_INTEROP turns the interop test's two skip paths
        # into failures. Without it the test is allowed to print a SKIP and pass,
        # which is the exact shape this repo has been publishing as green
        # elsewhere: the test exists, is invoked, and does not run.
        #
        # It is set HERE and deliberately not elsewhere. The other REQUIRE guards
        # (`THEYOS_REQUIRE_REAL_UTUN`, `THEYOS_REQUIRE_TPM`) demand root, a real
        # kernel interface or lab hardware, so setting them on a hosted runner
        # would produce environmental reds and get the guards reverted. This one
        # is different: an ordinary GitHub runner CAN satisfy it once uv is
        # installed above, so leaving it permissive here is a CI defect rather
        # than an accommodation.
        #
        # `--nocapture` on the core crate is EVIDENCE, not debugging noise, and
        # removing it silently blinds this step. libtest captures the stdout of
        # a PASSING test, so a skip that returns early prints its reason into a
        # buffer that is then discarded. Measured, with the peer unavailable:
        #
        #   test noise::tests::handshake_agrees_with_an_independent… ... ok
        #   test result: ok. 1 passed; 0 failed; …
        #
        # — byte-identical to a run where the handshake actually happened, and
        # the string "SKIP" appears nowhere. So "no SKIP in the log" cannot tell
        # the two apart; it is exactly what a silent skip looks like.
        #
        # With `--nocapture` the log carries the discriminator directly: the
        # success path prints `interop peer: noiseprotocol=0.3.1`, naming the
        # independent implementation the claim was made against, and the skip
        # path prints its reason where a reader can see it.
        env:
          THEYOS_REQUIRE_NOISE_INTEROP: "1"
        run: |
          cd admin/rust/mesh-session-core-rs && cargo test --locked -- --test-threads=1 --nocapture 2>&1
          cd ../mesh-session-control-model-rs && cargo test --locked -- --test-threads=1 2>&1
          cargo test --locked --features test-support,roster-sync-unratified \
            --lib --test model_invariants --test cas_multiprocess -- --test-threads=1 2>&1
      - name: Slow phase3 rollback tests (injected budget)
        # The three tests above run here with the injectable budget (B1) at 1s,
        # preserving what they prove (a launched finalize POST against an
        # unreachable M2 fails closed) without the ~300s wait each. The budget
        # knob only shortens (ceiling = production RECOVERY_TIMEOUT), so the
        # fail-closed verdict is the same, reached faster.
        env:
          THEYOS_PHASE3_RECOVERY_TIMEOUT_SECS: "1"
        run: |
          cd admin/rust && cargo test -p e2e-rs --features failure-injection \
            --test phase3_atomic_rollback -- --test-threads=1 \
            test_m1_crash_between_step10_and_step11_recovers_to_rollback \
            test_m2_disconnect_after_approval_rolls_back \
            test_recovery_timeout_rolls_back_when_m2_permanently_lost 2>&1
      - name: Feature-gated compile-fail proofs (mesh-session-runtime)
        # `cargo test --workspace` runs with DEFAULT features, so any trybuild
        # case inside a `#[cfg(feature = "...")]` test fn is never executed --
        # it is merely NAMED in the source. Two of them guard
        # `SealedBinding::from_membership_key` against a raw `ProofI` and a bare
        # `m_id`, which is the "never a raw ProofI" rule, and neither was being
        # run anywhere.
        #
        # `cargo check --features` (the feature-surface step above) compiles the
        # crate but does NOT execute trybuild, so it cannot substitute for this.
        #
        # Measured before adding: break `membership_key_from_raw_proof_i.rs` so
        # it compiles, and this step exits 101 while the default `cargo test`
        # above still exits 0. The step is the only thing that sees it.
        run: cd admin/rust && cargo test -p household-rs --features mesh-session-runtime --test compile_fail_peer_expectation -- --test-threads=1 2>&1
      - name: Feature-gated datapath tests (dev_t1_datapath)
        # The clippy step above COMPILES everything behind `dev_t1_datapath`;
        # it does not RUN any of it. `cargo test --workspace` uses default
        # features (`default = []`), so it never sees these targets either.
        # Between the two, 11 tests were named in the source, type-checked on
        # every push, and executed nowhere -- including the only end-to-end
        # proof that packets traverse the relay in BOTH directions, and the
        # two guards this PR adds that a served allocation matches the
        # configured session.
        #
        # That gap is not hypothetical. The two-ended datapath test was failing
        # closed with `ClockUnusable`: its synthetic `NOW` sits ~161 days ahead
        # of the host clock, while `SessionClock::live_now` deliberately
        # re-reads the real wall to catch suspend and forward jumps, so the
        # live reading came in BELOW `accepted_at` and was refused as a wall
        # regression. Nothing in CI could observe that, so nothing did.
        # Compiling a test proves it type-checks; only running it proves the
        # thing it asserts.
        #
        # Measured before adding: restore the synthetic constant and this step
        # exits 101 while every other step in this job still exits 0.
        run: cd admin/rust && cargo test -p t1-iptunnel-dev-runner-rs --features dev_t1_datapath --locked -- --test-threads=1 2>&1
      - name: APNS dispatcher opacity lint (Constitution III source-level gate)
        # Third leg of the three-layer "no household metadata reaches the
        # push provider" enforcement stack (compile-time API shape +
        # runtime spy test + this lint). The contract documents this as
        # "wired into CI" — keep it true.
        run: bash admin/rust/scripts/lint-apns-payload.sh

  validate-bridge:
    name: ClawShareBridge (B3-0 slice)
    runs-on: macos-15
    timeout-minutes: 30

    # B3-0 scope: validate the Rust↔Swift bridge SOURCE only. No XCFramework
    # job — this slice ships no binary artifact. The upstream
    # `claw-share-bridge-xcframework.yml` on `product-a-membership` marked its
    # artifact job `continue-on-error: true`, so for months it could fail
    # without failing the workflow, which is exactly how a broken binding step
    # went unnoticed. A job that cannot fail the build is not a gate; it is
    # reintroduced in the slice that actually produces the artifact, without
    # that flag.
    #
    # `clippy -D warnings` and `fmt --check` are additions over the source
    # branch: the base workspace enforces lints (including
    # `disallowed_methods = "deny"`) that it did not, and porting the crate
    # surfaced real violations. Gating here keeps them fixed.
    #
    # WHY THIS LIVES IN backend-ci.yml AND NOT ITS OWN WORKFLOW FILE.
    # An earlier revision of this slice shipped `.github/workflows/
    # claw-share-bridge.yml` with a deliberately asymmetric trigger list
    # (`push` on the topic branch, `pull_request` on the *base* branches it can
    # merge into). That file cannot exist: `.github/scripts/check-mobile-claw-
    # vpn-owner-present-phase0-compileout.sh` classifies `.github/workflows`
    # against a hardcoded KNOWN_WORKFLOWS list by exact `cmp`, so ANY new
    # workflow file fails the Phase 0 authority gate — and that script is a
    # base-owned protected object (`land-exact` in `.github/owner-present-
    # phase0-protected-objects-v1.tsv`) whose policy the integrity checker
    # reads from the PR's BASE, so a PR cannot classify itself. Amending it
    # needs an owner-armed Phase 0 transition.
    #
    # Folding the job in here needs no protected-object change, because
    # `backend-ci.yml` is already classified and is not itself protected. The
    # audited trigger asymmetry is consciously traded for this workflow's
    # broader triggers: `admin/rust/**` is a superset of the old path list
    # (`claw-share-bridge-rs`, `household-rs`, `nostr-relay-rs`, `Cargo.toml`,
    # `Cargo.lock`), and neither `push` nor `pull_request` is branch-filtered
    # here, so this runs on strictly MORE events than the standalone file did.
    # More coverage, not less gate.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rust toolchain info
        working-directory: admin/rust
        run: rustup show

      # `admin/rust/rust-toolchain.toml` pins 1.92.0 with `profile = "minimal"`
      # and `components = ["clippy"]` — rustfmt is deliberately NOT in that set,
      # so `cargo fmt` resolves to nothing and the gate below dies with
      # "'cargo-fmt' is not installed for the toolchain '1.92.0-...'".
      # Add the component here rather than widening the toolchain file: that
      # file is itself a base-owned protected Phase 0 object, and every other
      # consumer of the pin gets the smaller install. `--toolchain 1.92.0`
      # keeps the version explicit while letting rustup append the host triple,
      # so this step is not pinned to the runner's architecture.
      - name: Install rustfmt for the pinned toolchain
        working-directory: admin/rust
        run: rustup component add --toolchain 1.92.0 rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "admin/rust -> target"

      - name: rustfmt
        working-directory: admin/rust
        run: cargo fmt -p claw-share-bridge-rs -- --check

      # Default features: proves the crate builds without dragging the
      # MPL-2.0 uniffi tree into an ordinary workspace build.
      - name: cargo check (default features)
        working-directory: admin/rust
        run: cargo check -p claw-share-bridge-rs

      - name: cargo clippy (default features)
        working-directory: admin/rust
        run: cargo clippy -p claw-share-bridge-rs -- -D warnings

      # `--features uniffi`: proves the exported FFI surface still compiles,
      # which is what the next slice generates Swift bindings from.
      - name: cargo check (--features uniffi)
        working-directory: admin/rust
        run: cargo check -p claw-share-bridge-rs --features uniffi

      - name: cargo clippy (--features uniffi)
        working-directory: admin/rust
        run: cargo clippy -p claw-share-bridge-rs --features uniffi -- -D warnings

      # Covers the post-Open NetworkSettings path: the frame is parsed and
      # surfaced, non-IpTunnel paths stay None, and a wrong/duplicate/pre-
      # handshake frame fails closed.
      - name: cargo test
        working-directory: admin/rust
        run: cargo test -p claw-share-bridge-rs

      - name: Lane C graph gate (Product A / D4 boundary, blocking)
        # The gate existed from 6bd1f57c with a baseline, an allowlist, and two
        # non-vacuity probes -- and no job invoked it, in any spelling. It has
        # failed since 6d1ce46c and nobody saw it for 63 commits, including the
        # approval that declared "gates green". This workflow already says, of
        # another job, "A job that cannot fail the build is not a gate"; this
        # step is that sentence applied to the instrument that enforces the
        # Product A / nvpn and feature-off boundaries.
        #
        # The `skip=0` assertion below is DEFENCE IN DEPTH, not the primary fix.
        # It was written against a script that ended with `[ "$fail" -eq 0 ] ||
        # exit 1`, so `pass=0 fail=0 skip=7` exited 0 -- the script's own header
        # refused to count SKIP as PASS while its exit code did. That defect is
        # fixed in this same commit at both exit sites (structural and full), and
        # `fail=0 skip=7` now exits 1 on its own. The assertion is kept anyway:
        # it fails the build on the summary CI can actually see, so a future
        # regression in the script's exit path cannot silently restore the hole.
        #
        # Measured on this tree (worktree at b750f2c6 + this movement):
        #   before the movement                 -> pass=4 fail=3 skip=0, exit 1
        #   after                               -> pass=7 fail=0 skip=0, exit 0
        #   synthetic normal edge to core-rs    -> FAIL (the predicate's own RED)
        working-directory: admin/rust
        run: |
          set -o pipefail
          bash scripts/graph-gate/run_gate.sh structural 2>&1 | tee /tmp/graph-gate.log
          summary="$(grep -E '^pass=[0-9]+ fail=[0-9]+ skip=[0-9]+$' /tmp/graph-gate.log | tail -1)"
          echo "summary: ${summary}"
          case "${summary}" in
            *" skip=0") ;;
            "") echo "::error::graph gate printed no summary line -- it did not run to completion"; exit 1 ;;
            *) echo "::error::graph gate reported SKIPs (${summary}); a skipped configuration is not a pass"; exit 1 ;;
          esac

  no-bash-policy:
    name: No-Bash Policy Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check for bash invocations in Rust source
        run: |
          # Fail on any Command::new("bash") or /bin/bash in operational Rust code.
          # Test files (tests/, src/bin/*_test.rs) are excluded — they may use shell scripts
          # as fake IPC binaries. Comments (lines starting with //) are also excluded.
          # Guest-side content (strings written into VMs/chroots) is acceptable.
          HITS=$(grep -rn 'Command::new("bash")\|/bin/bash' admin/rust/ \
                   --include='*.rs' \
                   | grep -v '/target/' \
                   | grep -v '/tests/' \
                   | grep -v '^\s*//' \
                 || true)
          if [ -n "$HITS" ]; then
            echo "::error::Found bash invocation in Rust operational code:"
            echo "$HITS"
            echo "Policy: use /bin/sh or direct exec. See P28 in CLAUDE.md."
            exit 1
          fi
          echo "OK: no bash invocations found in operational Rust source"

      - name: Check for new operational .sh scripts
        run: |
          # P28: operational shell scripts are forbidden. Keep the policy strict for
          # unexpected additions, but allow the existing repo-root release/dev helpers.
          OPERATIONAL=$(find scripts/ -name '*.sh' -type f \
            ! -path 'scripts/make.sh' \
            ! -path 'scripts/publish-claw-artifact.sh' \
            ! -path 'scripts/backfill-artifact-manifest-signatures.sh' \
            ! -path 'scripts/check-artifact-signature-rollout.sh' \
            ! -path 'scripts/verify-artifact-manifest-signature-urls.sh' \
            ! -path 'scripts/generate-brew-formula.sh' \
            ! -path 'scripts/install-linux.sh' \
            ! -path 'scripts/uninstall-linux.sh' \
            ! -path 'scripts/run-t1-dev-datapath.sh' \
            ! -path 'scripts/test_run_t1_dev_datapath.sh' \
            2>/dev/null || true)
          if [ -n "$OPERATIONAL" ]; then
            echo "::error::Found .sh scripts in scripts/ — policy: all operations must use Rust binaries"
            echo "$OPERATIONAL"
            exit 1
          fi
          echo "OK: no .sh scripts found in scripts/"

  installer-tests:
    name: Installer Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Syntax check
        run: bash -n install-nixos && bash -n tests/install-nixos-test.sh && bash -n tests/nixos-install/test.sh

      - name: Run install-nixos unit tests
        # Pure bash; never invokes nixos-rebuild. Covers --help side-effects,
        # no-TTY access-mode resolution, --dry-run, host.nix reuse/conflict,
        # and SIGINT guidance.
        run: bash tests/install-nixos-test.sh
