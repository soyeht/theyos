        run: |
          cd admin/rust && cargo test --workspace -- --test-threads=1 \
            --skip test_m1_crash_between_step10_and_step11_recovers_to_rollback \
            --skip test_m2_disconnect_after_approval_rolls_back \
            --skip test_recovery_timeout_rolls_back_when_m2_permanently_lost 2>&1
      - name: Install uv (two suites shell out to it)
        # ORDER IS LOAD-BEARING, and it is why this step moved up. It used to sit
