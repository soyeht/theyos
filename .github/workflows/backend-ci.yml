name: Backend CI

on:
  push:
    paths:
      - "admin/rust/**"
      - "admin/contracts/mobile-claw-vpn/v1/**"
      - "admin/contracts/owner-approval/v2/**"
      - ".env.example"
      - "install-nixos"
      - "nix/**"
      - "tests/install-nixos-test.sh"
      - "tests/nixos-install/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "admin/rust/**"
      - "admin/contracts/mobile-claw-vpn/v1/**"
      - "admin/contracts/owner-approval/v2/**"
      - ".env.example"
      - "install-nixos"
      - "nix/**"
      - "tests/install-nixos-test.sh"
      - "tests/nixos-install/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  build-and-test-linux:
    name: Build & Test (Rust / Linux)
    runs-on: ubuntu-latest
    # 50, not 30: three phase3_atomic_rollback tests each wait out the full
    # production RECOVERY_TIMEOUT (~300s) because a launched finalize POST
    # retries against an unreachable M2 before owner_approve_handler returns —
    # documented in 6476673a and tracked as its own follow-up. At 30 the job was
    # cancelled mid-suite, which reads as a failure but measured nothing. Raise
    # the ceiling rather than shorten the budget: the wait is what those tests
    # prove. Drop this back when the retry policy becomes injectable.
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Reclaim runner disk before Rust build
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Disk diagnostics before cleanup"
          df -h /
          for path in /usr/local/lib/android /usr/share/dotnet /opt/ghc; do
            if [ -e "$path" ]; then
              sudo du -sh "$path"
            fi
          done
          if docker info >/dev/null 2>&1; then
            docker system df
          else
            echo "Docker daemon unavailable; skipping Docker diagnostics"
          fi
          echo "::endgroup::"

          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          if docker info >/dev/null 2>&1; then
            docker system prune --all --force --volumes
          fi
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "::group::Disk diagnostics after cleanup"
          df -h /
          if docker info >/dev/null 2>&1; then
            docker system df
          else
            echo "Docker daemon unavailable; skipping Docker diagnostics"
          fi
          echo "::endgroup::"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y openssh-server pkg-config libdbus-1-dev libkeyutils-dev
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "admin/rust -> target"
      - name: Clippy (deny warnings)
        run: cd admin/rust && cargo clippy --workspace -- -D warnings 2>&1
      - name: Clippy (dev datapath feature, all targets)
        # The workspace clippy above compiles neither this crate's TEST target nor
        # anything behind `dev_t1_datapath`, and no other job enables that feature.
        # A caller left broken by the #406 admission-API change therefore reached
        # main invisibly: the bin test still passed `u64` where the callee now takes
        # `Option<u64>` and `AdmissionInstant`. This step is the missing coverage.
        # Proven non-vacuous: this exact command exits 101 at 274f7cf5 and 0 once the
        # caller is repaired. The test it protects is feature-gated only, with no
        # target_os gate, so it is real coverage on both runners.
        run: cd admin/rust && cargo clippy -p t1-iptunnel-dev-runner-rs --all-targets --features dev_t1_datapath --locked -- -D warnings 2>&1
      - name: Feature surface compiles (all targets)
        # Closes the CLASS the step above closes one instance of. No job passes
        # `--all-targets`, and no job enables a non-default feature except
        # `uniffi`, so every (package, feature) pair is a place a caller can rot
        # invisibly exactly as the #406 admission-API change did.
        #
        # The pair list is DERIVED from `cargo metadata`, never hand-written: a
        # hand-built list starts wrong (hand-parsing the `[features]` sections
        # misses `claw-share-bridge-rs/uniffi` and `server-rs/dev_t1_datapath`)
        # and rots the moment a feature is added. This one cannot fall behind.
        #
        # Compile-only on purpose. `cargo clippy --all-targets -- -D warnings`
        # exits 101 across core-rs/server-rs/vmrunner-rs/e2e-rs on DEFAULT
        # features today: pre-existing lints in TEST code that CI has never
        # linted because it never passes `--all-targets`. The variable is
        # `--all-targets`, not the feature. Linting here would red on day one
        # for reasons unrelated to the defect; that debt is filed separately.
        #
        # Debug profile on purpose: server-rs/src/main.rs carries a
        # `not(debug_assertions)` compile_error! refusing DEV features in
        # release, so debug exercises the surface without touching that guard.
        run: |
          cd admin/rust
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | . as $p | ($p.features|keys[]) | select(.!="default") | "\($p.name)\t\(.)"' \
            | sort >/tmp/feature-surface.tsv
          rc=0
          while IFS=$'\t' read -r pkg feat; do
            echo "::group::check ${pkg} --features ${feat}"
            cargo check --locked -p "${pkg}" --all-targets --features "${feat}" || { echo "::error::${pkg} fails to compile with --features ${feat}"; rc=1; }
            echo "::endgroup::"
          done </tmp/feature-surface.tsv
          exit $rc
      - name: Build workspace
        run: cd admin/rust && cargo build --workspace 2>&1
      - name: Run tests (serialised)
        run: cd admin/rust && cargo test --workspace -- --test-threads=1 2>&1
      - name: Feature-gated compile-fail proofs (mesh-session-runtime)
        # `cargo test --workspace` runs with DEFAULT features, so any trybuild
        # case inside a `#[cfg(feature = "...")]` test fn is never executed --
        # it is merely NAMED in the source. Two of them guard
        # `SealedBinding::from_membership_key` against a raw `ProofI` and a bare
        # `m_id`, which is the "never a raw ProofI" rule, and neither was being
        # run anywhere.
        #
        # `cargo check --features` (the feature-surface step above) compiles the
        # crate but does NOT execute trybuild, so it cannot substitute for this.
        #
        # Measured before adding: break `membership_key_from_raw_proof_i.rs` so
        # it compiles, and this step exits 101 while the default `cargo test`
        # above still exits 0. The step is the only thing that sees it.
        run: cd admin/rust && cargo test -p household-rs --features mesh-session-runtime --test compile_fail_peer_expectation -- --test-threads=1 2>&1
      - name: APNS dispatcher opacity lint (Constitution III source-level gate)
        # Third leg of the three-layer "no household metadata reaches the
        # push provider" enforcement stack (compile-time API shape +
        # runtime spy test + this lint). The contract documents this as
        # "wired into CI" — keep it true.
        run: bash admin/rust/scripts/lint-apns-payload.sh

