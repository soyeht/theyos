name: Backend CI

on:
  # Branch pushes are deliberately NOT built here. A PR branch fires `push` and
  # `pull_request` on the same SHA, and with identical `paths` below that built
  # every commit twice: ~86 wasted runner-minutes per PR, and — worse — two
  # independent rolls of every flaky test, so a correct PR had double the chance
  # of being failed by noise. Measured on #432 and #433.
  #
  # `main` stays: the post-merge run on this branch is what caught 5b04e135, a
  # direct push that broke compilation on both OS and left main red for ~20h.
  #
  # Proved on a throwaway repo with this repo's protection geometry before
  # landing (5/5): PR with backend paths still publishes all four required
  # contexts on the head; docs-only PRs are still covered by the shim; a PR
  # branch created *before* this change still gets its contexts, because
  # `pull_request` evaluates the workflow from the merge commit.
  push:
    branches:
      - main
    paths:
      - "admin/rust/**"
      - "scripts/**"
      - "PORTS.md"
      - "admin/contracts/claw-store/v1/claw-store-household-v1.json"
      - "admin/contracts/claw-store/v1/contract.json"
      - "claws/manifest.yml"
      - "admin/contracts/mobile-claw-vpn/v1/**"
      - "admin/contracts/owner-approval/v2/**"
      - "admin/contracts/mesh-session/**"
      - ".env.example"
      - "install-nixos"
      - "nix/**"
      - "tests/install-nixos-test.sh"
      - "tests/nixos-install/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/backend-ci-docs-shim.yml"
      - ".github/workflows/owner-present-phase0-integrity.yml"
      - ".github/workflows/release-linux.yml"
      - ".github/workflows/release-macos.yml"
  pull_request:
    paths:
      - "admin/rust/**"
      - "scripts/**"
      - "PORTS.md"
      - "admin/contracts/claw-store/v1/claw-store-household-v1.json"
      - "admin/contracts/claw-store/v1/contract.json"
      - "claws/manifest.yml"
      - "admin/contracts/mobile-claw-vpn/v1/**"
      - "admin/contracts/owner-approval/v2/**"
      - "admin/contracts/mesh-session/**"
      - ".env.example"
      - "install-nixos"
      - "nix/**"
      - "tests/install-nixos-test.sh"
      - "tests/nixos-install/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/backend-ci-docs-shim.yml"
      - ".github/workflows/owner-present-phase0-integrity.yml"
      - ".github/workflows/release-linux.yml"
      - ".github/workflows/release-macos.yml"
  workflow_dispatch:

# One run per workflow per ref. A new commit supersedes the old run instead of
# leaving it to burn a full build on code that no longer exists.
#
# `main` is deliberately exempt: the post-merge run on this branch is what
# caught 5b04e135, a direct push that broke compilation on both platforms.
# Cancelling it because someone pushed a branch would throw away the only
# signal that covers what landed.
concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quarantine-isolation-probes:
    name: Quarantine isolation probes (${{ matrix.os }}, non-required)
    runs-on: ${{ matrix.os }}
    # The cold prebuild is outside the per-attempt timer. Once built, the 40
    # sequential observations have a 10s ceiling each (6m40s worst case), so
    # the job has ample room to publish both deterministic summaries.
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install native test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openssh-server pkg-config libdbus-1-dev libkeyutils-dev
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "admin/rust -> target"
      - name: Probe harness self-tests
        run: |
          python3 -m py_compile scripts/quarantine_probe.py scripts/test_quarantine_probe.py
          python3 scripts/test_quarantine_probe.py
      - name: Build both quarantined test binaries
        working-directory: admin/rust
        run: |
          cargo test --locked -p vmrunner-rs --lib --no-run
          cargo test --locked -p household-rs --lib --no-run
      - name: Probe issue 438 (create_guard cleanup)
        id: probe_438
        continue-on-error: true
        run: |
          python3 scripts/quarantine_probe.py \
            --issue 438 \
            --attempts 20 \
            --attempt-timeout-seconds 10 \
            --package vmrunner-rs \
            --test create_guard::tests::cleanup_quarantines_real_term_ignoring_survivor_after_force_attempts
      - name: Probe issue 450 (pair_machine delayed restart)
        id: probe_450
        continue-on-error: true
        run: |
          python3 scripts/quarantine_probe.py \
            --issue 450 \
            --attempts 20 \
            --attempt-timeout-seconds 10 \
            --package household-rs \
            --test pair_machine::tests::delayed_restart_response_never_sleeps_against_a_stale_budget
      - name: Require valid probe instruments
        if: always()
        env:
          PROBE_438_OUTCOME: ${{ steps.probe_438.outcome }}
          PROBE_450_OUTCOME: ${{ steps.probe_450.outcome }}
        run: |
          if [[ "${PROBE_438_OUTCOME}" != "success" || "${PROBE_450_OUTCOME}" != "success" ]]; then
            echo "::error::At least one quarantine probe was invalid; inspect PROBE_* invalid counts"
            exit 1
          fi

  build-and-test-linux:
    name: Build & Test (Rust / Linux)
    runs-on: ubuntu-latest
    # 50, not 30: three phase3_atomic_rollback tests each wait out the full
    # production RECOVERY_TIMEOUT (~300s) because a launched finalize POST
    # retries against an unreachable M2 before owner_approve_handler returns —
    # documented in 6476673a and tracked as its own follow-up. At 30 the job was
    # cancelled mid-suite, which reads as a failure but measured nothing. Raise
    # the ceiling rather than shorten the budget: the wait is what those tests
    # prove. Drop this back when the retry policy becomes injectable.
    # (B1) The retry budget is now injectable; the three slow tests run with
    # THEYOS_PHASE3_RECOVERY_TIMEOUT_SECS=1 in a separate step, so this job no
    # longer carries the ~300s×3. The remaining cost is the cold all-targets
    # build: with no warm cache it has measured into the low-20-minute range on
    # ubuntu-latest, and with the full suite on top the job has crossed 50 and
    # been cancelled mid-suite (which measures nothing). 50 gave no real
    # headroom, so it is raised to 75; lower it as its own measured change once
    # the compile is cached or trimmed.
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Reclaim runner disk before Rust build
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Disk diagnostics before cleanup"
          df -h /
          for path in /usr/local/lib/android /usr/share/dotnet /opt/ghc; do
            if [ -e "$path" ]; then
              sudo du -sh "$path"
            fi
          done
          if docker info >/dev/null 2>&1; then
            docker system df
          else
            echo "Docker daemon unavailable; skipping Docker diagnostics"
          fi
          echo "::endgroup::"

          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          if docker info >/dev/null 2>&1; then
            docker system prune --all --force --volumes
          fi
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "::group::Disk diagnostics after cleanup"
          df -h /
          if docker info >/dev/null 2>&1; then
            docker system df
          else
            echo "Docker daemon unavailable; skipping Docker diagnostics"
          fi
          echo "::endgroup::"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y openssh-server pkg-config libdbus-1-dev libkeyutils-dev
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "admin/rust -> target"
      - name: Clippy (deny warnings)
        run: admin/rust/scripts/backend-rust clippy-workspace
      - name: Clippy (dev datapath feature, all targets)
        run: admin/rust/scripts/backend-rust clippy-datapath
      - name: Feature surface compiles (all targets)
        run: admin/rust/scripts/backend-rust feature-surface
      - name: Build workspace
        run: admin/rust/scripts/backend-rust build
      - name: Populate the registry for the WHOLE resolve graph
        run: admin/rust/scripts/backend-rust fetch-locked
      - name: Run tests (serialised)
        run: admin/rust/scripts/backend-rust test-serialised
      - name: Quarantine probe (issue #470)
        run: |
          # QUARANTINE_PROBE_470_BEGIN
          # Preserve the required 0/5 containment while refusing cargo's rc=0
          # for a vacant --exact selector. The full workspace test immediately
          # above prebuilds this target; 120s bounds a hung attempt without
          # conflating the observed ~44s runtime with an invalid instrument.
          python3 scripts/test_quarantine_probe.py
          python3 scripts/quarantine_probe.py \
            --issue 470 \
            --attempts 5 \
            --attempt-timeout-seconds 120 \
            --package e2e-rs \
            --test-target phase3_observability_audit \
            --test test_owner_timeout_aborts_window_and_emits_tracing \
            --require-pass
          # QUARANTINE_PROBE_470_END
      - name: Install uv (two suites shell out to it)
        # ORDER IS LOAD-BEARING, and it is why this step moved up. It used to sit
        # further down, immediately before the datapath step that needed it. The
        # mesh-session step below ALSO needs uv now, so with the old placement it
        # ran before uv existed, took the "no uv" branch, and skipped the interop
        # test — green, on a runner that could have satisfied it.
        #
        # Two consumers, both cross-language on purpose:
        #
        #   1. `mesh-session-core-rs/src/noise.rs` spawns
        #      `uv run --with noiseprotocol==0.3.1 python
        #      scripts/noise-conformance-peer.py`. Two of our own programs
        #      agreeing prove nothing about a protocol; that peer shares no code
        #      with `snow`, so the agreement is evidence about Noise rather than
        #      about our wiring.
        #   2. `t1-iptunnel-dev-runner-rs/tests/cross_lang_device_config.rs`
        #      checks the generated session config against the Python validator.
        #      It carries `required-features = ["dev_t1_datapath"]`, so it runs
        #      ONLY in the feature-gated step and never appeared in
        #      `cargo test --workspace`; that is why no job here needed uv until
        #      recently, and why that step first failed on macOS with "uv must be
        #      installed (repo convention: run Python via `uv run`)".
        uses: astral-sh/setup-uv@v5
      - name: Excluded workspace members (mesh-session core + control model)
        run: admin/rust/scripts/backend-rust excluded-members
      - name: Slow phase3 rollback tests (injected budget)
        run: admin/rust/scripts/backend-rust slow-phase3
      - name: Feature-gated compile-fail proofs (mesh-session-runtime)
        run: admin/rust/scripts/backend-rust compile-fail-proofs
      - name: Feature-gated datapath tests (dev_t1_datapath)
        run: admin/rust/scripts/backend-rust datapath-tests
      - name: APNS dispatcher opacity lint (Constitution III source-level gate)
        run: admin/rust/scripts/backend-rust apns-lint

  build-and-test-macos:
    name: Build & Test (Rust / macOS)
    runs-on: macos-15
    # Same reason as the Linux job above: the ~300s×3 RECOVERY_TIMEOUT wait in
    # phase3_atomic_rollback is what those tests prove, not overhead to trim.
    # (B1) Same protocol as Linux: the three slow tests now run in a separate
    # step with the injected 1s budget, so the wait no longer sits in the
    # serialised step. The cold all-targets build is slower here — measured
    # into the high-20-minute range on macos-15 — so with the suite on top the
    # job also crosses 50. 50 gave no real headroom; raised to 75, to be
    # lowered again once the compile is cached or trimmed.
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # macOS-15 GitHub-hosted runners ship Xcode 16 by default; no xcode-select needed.
      # The bonjour_impl_dns_sd build.rs calls xcrun --show-sdk-path, which requires
      # the Xcode CLI tools — they are pre-installed on all macos-15 images.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "admin/rust -> target"
      - name: Clippy (deny warnings)
        run: admin/rust/scripts/backend-rust clippy-workspace
      - name: Clippy (dev datapath feature, all targets)
        run: admin/rust/scripts/backend-rust clippy-datapath
      - name: Feature surface compiles (all targets)
        run: admin/rust/scripts/backend-rust feature-surface
      - name: Build workspace
        run: admin/rust/scripts/backend-rust build
      - name: Populate the registry for the WHOLE resolve graph
        run: admin/rust/scripts/backend-rust fetch-locked
      - name: Run tests (serialised)
        run: admin/rust/scripts/backend-rust test-serialised
      - name: Install uv (two suites shell out to it)
        # ORDER IS LOAD-BEARING, and it is why this step moved up. It used to sit
        # further down, immediately before the datapath step that needed it. The
        # mesh-session step below ALSO needs uv now, so with the old placement it
        # ran before uv existed, took the "no uv" branch, and skipped the interop
        # test — green, on a runner that could have satisfied it.
        #
        # Two consumers, both cross-language on purpose:
        #
        #   1. `mesh-session-core-rs/src/noise.rs` spawns
        #      `uv run --with noiseprotocol==0.3.1 python
        #      scripts/noise-conformance-peer.py`. Two of our own programs
        #      agreeing prove nothing about a protocol; that peer shares no code
        #      with `snow`, so the agreement is evidence about Noise rather than
        #      about our wiring.
        #   2. `t1-iptunnel-dev-runner-rs/tests/cross_lang_device_config.rs`
        #      checks the generated session config against the Python validator.
        #      It carries `required-features = ["dev_t1_datapath"]`, so it runs
        #      ONLY in the feature-gated step and never appeared in
        #      `cargo test --workspace`; that is why no job here needed uv until
        #      recently, and why that step first failed on macOS with "uv must be
        #      installed (repo convention: run Python via `uv run`)".
        uses: astral-sh/setup-uv@v5
      - name: Excluded workspace members (mesh-session core + control model)
        run: admin/rust/scripts/backend-rust excluded-members
      - name: Slow phase3 rollback tests (injected budget)
        run: admin/rust/scripts/backend-rust slow-phase3
      - name: Feature-gated compile-fail proofs (mesh-session-runtime)
        run: admin/rust/scripts/backend-rust compile-fail-proofs
      - name: Feature-gated datapath tests (dev_t1_datapath)
        run: admin/rust/scripts/backend-rust datapath-tests
      - name: APNS dispatcher opacity lint (Constitution III source-level gate)
        run: admin/rust/scripts/backend-rust apns-lint

  validate-bridge:
    name: ClawShareBridge (B3-0 slice)
    runs-on: macos-15
    timeout-minutes: 30

    # B3-0 scope: validate the Rust↔Swift bridge SOURCE only. No XCFramework
    # job — this slice ships no binary artifact. The upstream
    # `claw-share-bridge-xcframework.yml` on `product-a-membership` marked its
    # artifact job `continue-on-error: true`, so for months it could fail
    # without failing the workflow, which is exactly how a broken binding step
    # went unnoticed. A job that cannot fail the build is not a gate; it is
    # reintroduced in the slice that actually produces the artifact, without
    # that flag.
    #
    # `clippy -D warnings` and `fmt --check` are additions over the source
    # branch: the base workspace enforces lints (including
    # `disallowed_methods = "deny"`) that it did not, and porting the crate
    # surfaced real violations. Gating here keeps them fixed.
    #
    # WHY THIS LIVES IN backend-ci.yml AND NOT ITS OWN WORKFLOW FILE.
    # An earlier revision of this slice shipped `.github/workflows/
    # claw-share-bridge.yml` with a deliberately asymmetric trigger list
    # (`push` on the topic branch, `pull_request` on the *base* branches it can
    # merge into). That file cannot exist: `.github/scripts/check-mobile-claw-
    # vpn-owner-present-phase0-compileout.sh` classifies `.github/workflows`
    # against a hardcoded KNOWN_WORKFLOWS list by exact `cmp`, so ANY new
    # workflow file fails the Phase 0 authority gate — and that script is a
    # base-owned protected object (`land-exact` in `.github/owner-present-
    # phase0-protected-objects-v1.tsv`) whose policy the integrity checker
    # reads from the PR's BASE, so a PR cannot classify itself. Amending it
    # needs an owner-armed Phase 0 transition.
    #
    # Folding the job in here needs no protected-object change, because
    # `backend-ci.yml` is already classified and is not itself protected. The
    # audited trigger asymmetry is consciously traded for this workflow's
    # broader triggers: `admin/rust/**` is a superset of the old path list
    # (`claw-share-bridge-rs`, `household-rs`, `nostr-relay-rs`, `Cargo.toml`,
    # `Cargo.lock`), and neither `push` nor `pull_request` is branch-filtered
    # here, so this runs on strictly MORE events than the standalone file did.
    # More coverage, not less gate.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rust toolchain info
        working-directory: admin/rust
        run: rustup show

      # `admin/rust/rust-toolchain.toml` pins 1.92.0 with `profile = "minimal"`
      # and `components = ["clippy"]` — rustfmt is deliberately NOT in that set,
      # so `cargo fmt` resolves to nothing and the gate below dies with
      # "'cargo-fmt' is not installed for the toolchain '1.92.0-...'".
      # Add the component here rather than widening the toolchain file: that
      # file is itself a base-owned protected Phase 0 object, and every other
      # consumer of the pin gets the smaller install. `--toolchain 1.92.0`
      # keeps the version explicit while letting rustup append the host triple,
      # so this step is not pinned to the runner's architecture.
      - name: Install rustfmt for the pinned toolchain
        working-directory: admin/rust
        run: rustup component add --toolchain 1.92.0 rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "admin/rust -> target"

      - name: rustfmt
        working-directory: admin/rust
        run: cargo fmt -p claw-share-bridge-rs -- --check

      # Default features: proves the crate builds without dragging the
      # MPL-2.0 uniffi tree into an ordinary workspace build.
      - name: cargo check (default features)
        working-directory: admin/rust
        run: cargo check -p claw-share-bridge-rs

      - name: cargo clippy (default features)
        working-directory: admin/rust
        run: cargo clippy -p claw-share-bridge-rs -- -D warnings

      # `--features uniffi`: proves the exported FFI surface still compiles,
      # which is what the next slice generates Swift bindings from.
      - name: cargo check (--features uniffi)
        working-directory: admin/rust
        run: cargo check -p claw-share-bridge-rs --features uniffi

      - name: cargo clippy (--features uniffi)
        working-directory: admin/rust
        run: cargo clippy -p claw-share-bridge-rs --features uniffi -- -D warnings

      # Covers the post-Open NetworkSettings path: the frame is parsed and
      # surfaced, non-IpTunnel paths stay None, and a wrong/duplicate/pre-
      # handshake frame fails closed.
      - name: cargo test
        working-directory: admin/rust
        run: cargo test -p claw-share-bridge-rs

      - name: Lane C graph gate (Product A / D4 boundary, blocking)
        # The gate existed from 6bd1f57c with a baseline, an allowlist, and two
        # non-vacuity probes -- and no job invoked it, in any spelling. It has
        # failed since 6d1ce46c and nobody saw it for 63 commits, including the
        # approval that declared "gates green". This workflow already says, of
        # another job, "A job that cannot fail the build is not a gate"; this
        # step is that sentence applied to the instrument that enforces the
        # Product A / nvpn and feature-off boundaries.
        #
        # The `skip=0` assertion below is DEFENCE IN DEPTH, not the primary fix.
        # It was written against a script that ended with `[ "$fail" -eq 0 ] ||
        # exit 1`, so `pass=0 fail=0 skip=7` exited 0 -- the script's own header
        # refused to count SKIP as PASS while its exit code did. That defect is
        # fixed in this same commit at both exit sites (structural and full), and
        # `fail=0 skip=7` now exits 1 on its own. The assertion is kept anyway:
        # it fails the build on the summary CI can actually see, so a future
        # regression in the script's exit path cannot silently restore the hole.
        #
        # Measured on this tree (worktree at b750f2c6 + this movement):
        #   before the movement                 -> pass=4 fail=3 skip=0, exit 1
        #   after                               -> pass=7 fail=0 skip=0, exit 0
        #   synthetic normal edge to core-rs    -> FAIL (the predicate's own RED)
        working-directory: admin/rust
        run: |
          set -o pipefail
          bash scripts/graph-gate/run_gate.sh structural 2>&1 | tee /tmp/graph-gate.log
          summary="$(grep -E '^pass=[0-9]+ fail=[0-9]+ skip=[0-9]+$' /tmp/graph-gate.log | tail -1)"
          echo "summary: ${summary}"
          case "${summary}" in
            *" skip=0") ;;
            "") echo "::error::graph gate printed no summary line -- it did not run to completion"; exit 1 ;;
            *) echo "::error::graph gate reported SKIPs (${summary}); a skipped configuration is not a pass"; exit 1 ;;
          esac

  backend-rust-command-contract:
    name: Backend Rust command contract
    # Its own job, under its own name, deliberately not folded into
    # "No-Bash Policy Check". That job publishes a context whose name promises a
    # bash policy; a phase-wiring contract riding inside it would be a different
    # guarantee reported under a false label, and a required context is read by
    # its name — nobody inspects which steps produced it.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Phase wiring gate compiles
        # Its own step because the two below must each be a single-line `run:`
        # equal to exactly the invocation the gate looks for. Setup sharing a
        # block scalar with the self-test would make neither of them countable:
        # a block scalar can hide a wrapper, a `||`, or a second command whose
        # status replaces the first, so the gate refuses to treat one as proof
        # that it ran.
        run: python3 -m py_compile scripts/ci/check-backend-rust-phase-wiring.py
      - name: Phase wiring gate self-test
        # Before the live check, because a comparison that has never been
        # observed to fail is indistinguishable from one that returns success
        # unconditionally. This mutates the pair in memory — a function dropped
        # from PHASES, an entry with no function, an invocation demoted to a
        # comment, this gate's own step replaced by an echo, a phase failing
        # part-way through its body — and requires each to be caught before any
        # real verdict is allowed to print.
        run: python3 scripts/ci/check-backend-rust-phase-wiring.py --self-test
      - name: Phase wiring gate (live)
        # PHASES must equal the phase_* functions must equal the phases each Rust
        # job actually invokes, per job and without duplicates. `backend-rust all`
        # is a published interface; if the registry stops governing execution the
        # enumeration and the executed set drift apart, and the quiet direction —
        # `all` covering less than CI — goes unnoticed.
        run: python3 scripts/ci/check-backend-rust-phase-wiring.py

  no-bash-policy:
    name: No-Bash Policy Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: External write safety guard self-tests
        run: |
          python3 -m py_compile \
            scripts/safe_external_write.py \
            scripts/test_safe_external_write.py
          python3 scripts/test_safe_external_write.py

      - name: Check for bash invocations in Rust source
        run: |
          # Fail on any Command::new("bash") or /bin/bash in operational Rust code.
          # Test files (tests/, src/bin/*_test.rs) are excluded — they may use shell scripts
          # as fake IPC binaries. Comments (lines starting with //) are also excluded.
          # Guest-side content (strings written into VMs/chroots) is acceptable.
          HITS=$(grep -rn 'Command::new("bash")\|/bin/bash' admin/rust/ \
                   --include='*.rs' \
                   | grep -v '/target/' \
                   | grep -v '/tests/' \
                   | grep -v '^\s*//' \
                 || true)
          if [ -n "$HITS" ]; then
            echo "::error::Found bash invocation in Rust operational code:"
            echo "$HITS"
            echo "Policy: use /bin/sh or direct exec. See P28 in CLAUDE.md."
            exit 1
          fi
          echo "OK: no bash invocations found in operational Rust source"

      - name: Check for new operational .sh scripts
        run: |
          # P28: operational shell scripts are forbidden. Keep the policy strict for
          # unexpected additions, but allow the existing repo-root release/dev helpers.
          OPERATIONAL=$(find scripts/ -name '*.sh' -type f \
            ! -path 'scripts/make.sh' \
            ! -path 'scripts/publish-claw-artifact.sh' \
            ! -path 'scripts/backfill-artifact-manifest-signatures.sh' \
            ! -path 'scripts/check-artifact-signature-rollout.sh' \
            ! -path 'scripts/verify-artifact-manifest-signature-urls.sh' \
            ! -path 'scripts/generate-brew-formula.sh' \
            ! -path 'scripts/install-linux.sh' \
            ! -path 'scripts/uninstall-linux.sh' \
            ! -path 'scripts/run-t1-dev-datapath.sh' \
            ! -path 'scripts/test_run_t1_dev_datapath.sh' \
            2>/dev/null || true)
          if [ -n "$OPERATIONAL" ]; then
            echo "::error::Found .sh scripts in scripts/ — policy: all operations must use Rust binaries"
            echo "$OPERATIONAL"
            exit 1
          fi
          echo "OK: no .sh scripts found in scripts/"

  installer-tests:
    name: Installer Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Syntax check
        run: bash -n install-nixos && bash -n tests/install-nixos-test.sh && bash -n tests/nixos-install/test.sh

      - name: Run install-nixos unit tests
        # Pure bash; never invokes nixos-rebuild. Covers --help side-effects,
        # no-TTY access-mode resolution, --dry-run, host.nix reuse/conflict,
        # and SIGINT guidance.
        run: bash tests/install-nixos-test.sh
