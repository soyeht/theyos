name: Cross-Repo Contract Sync

# Constitution V enforcement: contracts shared between theyos and soyeht-ios
# must not drift silently. Markdown mirrors are compared against CURRENT
# theyos@HEAD. The mobile owner-approval fixture is additionally checked as an
# exact byte-for-byte vendor at both the iOS pin and current theyos HEAD.
#
# Triggers: all PRs to main, source changes pushed to main, and onboarding
# contract changes on 005-soyeht-onboarding.
# Passes silently when no mirrors are registered yet.

on:
  pull_request:
    branches:
      - main
    paths:
      - "specs/005-soyeht-onboarding/contracts/**"
      - "admin/contracts/mobile-claw-vpn/v1/owner_approval_v2_execution_vectors.json"
      - ".github/workflows/contracts-cross-repo-sync.yml"
  push:
    branches:
      - main
      - "005-soyeht-onboarding"
    paths:
      - "specs/005-soyeht-onboarding/contracts/**"
      - "admin/contracts/mobile-claw-vpn/v1/owner_approval_v2_execution_vectors.json"
      - ".github/workflows/contracts-cross-repo-sync.yml"
  workflow_dispatch:

jobs:
  contracts-sync-check:
    name: Contract drift detection (theyos ↔ soyeht-ios)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout theyos
        uses: actions/checkout@v5
        with:
          path: theyos

      # Checkout soyeht-ios (public read — uses GITHUB_TOKEN for API rate limits).
      - name: Checkout soyeht-ios
        uses: actions/checkout@v5
        with:
          repository: soyeht/soyeht-ios
          path: soyeht-ios
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify mobile owner-approval fixture ownership
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          SOURCE_REL="admin/contracts/mobile-claw-vpn/v1/owner_approval_v2_execution_vectors.json"
          SOURCE="theyos/${SOURCE_REL}"
          VENDOR="soyeht-ios/Packages/SoyehtCore/Tests/SoyehtCoreTests/Fixtures/mobile-claw-vpn/v1/owner_approval_v2_execution_vectors.json"
          PIN_FILE="soyeht-ios/scripts/cross-repo-contract.sha"

          if [[ ! -f "${SOURCE}" ]]; then
            echo "::error file=${SOURCE_REL}::authoritative mobile owner-approval fixture is missing"
            exit 1
          fi

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "${TMP_DIR}"' EXIT
          BASE_HAS_SOURCE=0
          if [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]] \
            && [[ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            git -C theyos fetch --no-tags --depth=1 origin "${BASE_SHA}"
            if git -C theyos cat-file -e "${BASE_SHA}:${SOURCE_REL}" 2>/dev/null; then
              BASE_HAS_SOURCE=1
              git -C theyos show "${BASE_SHA}:${SOURCE_REL}" > "${TMP_DIR}/base-source"
              if ! cmp -s "${TMP_DIR}/base-source" "${SOURCE}"; then
                echo "::error::mobile owner-approval V1 is immutable; add a new versioned fixture"
                diff -u "${TMP_DIR}/base-source" "${SOURCE}" || true
                exit 1
              fi
            fi
          fi

          # Ordered bootstrap: the source must land in theyos before iOS can
          # vendor and pin it. Missing vendor is allowed only while this exact
          # source path is new relative to the event's base commit.
          if [[ ! -f "${VENDOR}" ]]; then
            if [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]] \
              && [[ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]] \
              && [[ "${BASE_HAS_SOURCE}" == "0" ]]; then
              echo "Bootstrap: authoritative fixture is new; land theyos before the iOS vendor/pin."
              exit 0
            fi
            echo "::error::iOS vendor missing for existing theyos fixture: ${VENDOR#soyeht-ios/}"
            exit 1
          fi

          if [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]] \
            && [[ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]] \
            && [[ "${BASE_HAS_SOURCE}" == "0" ]]; then
            echo "::error::iOS vendor landed before the authoritative theyos source"
            exit 1
          fi

          if [[ ! -f "${PIN_FILE}" ]]; then
            echo "::error::iOS cross-repo pin is missing"
            exit 1
          fi
          PIN="$(grep -vE '^[[:space:]]*#' "${PIN_FILE}" | tr -d '[:space:]')"
          if [[ ! "${PIN}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::iOS cross-repo pin must be one lowercase 40-hex commit"
            exit 1
          fi

          git -C theyos fetch --no-tags --depth=1 origin "${PIN}"
          PINNED_SOURCE="${TMP_DIR}/pinned-source"
          if ! git -C theyos show "${PIN}:${SOURCE_REL}" > "${PINNED_SOURCE}"; then
            echo "::error::iOS pin ${PIN} does not contain ${SOURCE_REL}"
            exit 1
          fi

          if ! cmp -s "${PINNED_SOURCE}" "${VENDOR}"; then
            echo "::error::iOS vendor differs from its pinned theyos source ${PIN}"
            diff -u "${PINNED_SOURCE}" "${VENDOR}" || true
            exit 1
          fi
          if ! cmp -s "${SOURCE}" "${VENDOR}"; then
            echo "::error::theyos HEAD changed without a matching landed iOS vendor"
            diff -u "${SOURCE}" "${VENDOR}" || true
            exit 1
          fi
          echo "✓ authoritative fixture matches iOS vendor at pin ${PIN} and theyos HEAD"

      - name: Scan and diff contract mirrors
        shell: bash
        run: |
          set -euo pipefail

          CONTRACTS_DIR="theyos/specs/005-soyeht-onboarding/contracts"
          SOYEHT_IOS_DIR="soyeht-ios"
          DRIFT=0
          MIRRORS_FOUND=0

          # Pattern: <!-- mirror of theyos:005/contracts/<file>.md as of <hash> -->
          MIRROR_PATTERN='<!-- mirror of theyos:005/contracts/([^.]+\.md) as of ([0-9a-f]{7,40}) -->'

          # Walk all markdown files in soyeht-ios looking for mirror headers.
          while IFS= read -r -d '' mirror_file; do
            if grep -qP "$MIRROR_PATTERN" "$mirror_file" 2>/dev/null; then
              while IFS= read -r match_line; do
                if [[ "$match_line" =~ $MIRROR_PATTERN ]]; then
                  CONTRACT_FILE="${BASH_REMATCH[1]}"
                  PINNED_HASH="${BASH_REMATCH[2]}"
                  MIRRORS_FOUND=$((MIRRORS_FOUND + 1))

                  SOURCE="$CONTRACTS_DIR/$CONTRACT_FILE"
                  if [[ ! -f "$SOURCE" ]]; then
                    echo "::error file=$mirror_file::Mirror references $CONTRACT_FILE but no such file in theyos contracts."
                    DRIFT=1
                    continue
                  fi

                  # Write mirror content (header stripped) to a temp file.
                  # Avoids echo flag swallowing (-n/-e) and trailing newline
                  # mismatch from command substitution + echo round-trip.
                  MIRROR_TMP=$(mktemp)
                  grep -v '<!-- mirror of theyos' "$mirror_file" > "$MIRROR_TMP" || true

                  # Diff current theyos@HEAD contract against the stripped mirror.
                  # The pinned hash is audit metadata only; the enforced invariant
                  # is mirror == HEAD so that upstream drift is caught immediately.
                  if ! diff "$SOURCE" "$MIRROR_TMP" > /dev/null 2>&1; then
                    echo "::error file=$mirror_file::Contract drift detected: $CONTRACT_FILE at HEAD differs from mirror $mirror_file (mirror pinned at $PINNED_HASH)"
                    echo "--- theyos $CONTRACT_FILE @ HEAD"
                    echo "+++ soyeht-ios mirror $mirror_file"
                    diff "$SOURCE" "$MIRROR_TMP" || true
                    DRIFT=1
                  else
                    echo "✓ $CONTRACT_FILE @ HEAD matches mirror $mirror_file (pinned at $PINNED_HASH)"
                  fi
                  rm -f "$MIRROR_TMP"
                fi
              done < <(grep -P "$MIRROR_PATTERN" "$mirror_file")
            fi
          done < <(find "$SOYEHT_IOS_DIR" -name "*.md" -print0)

          if [[ $MIRRORS_FOUND -eq 0 ]]; then
            echo "No contract mirrors registered yet — pass."
          else
            echo "Checked $MIRRORS_FOUND mirror(s)."
          fi

          if [[ $DRIFT -ne 0 ]]; then
            echo ""
            echo "Contract drift detected. Update the soyeht-ios mirror to match theyos@HEAD and bump its pinned hash."
            exit 1
          fi
