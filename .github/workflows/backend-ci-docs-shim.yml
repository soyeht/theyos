# Required-check shims for PRs that do not touch backend paths.
#
# backend-ci.yml only triggers on the paths listed below, but three of its
# jobs are REQUIRED status checks on main. A PR touching none of those
# paths (docs-only, QA-only, ...) leaves the required checks in
# "Expected" forever and the PR can never merge without an admin bypass
# (this blocked PR #343). This file is GitHub's documented workaround:
# https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks#handling-skipped-but-required-checks
#
# KEEP `paths-ignore` BYTE-IDENTICAL to `on.pull_request.paths` in
# backend-ci.yml.
#
# The old note here said drift's failure mode "is safe (a PR class where
# neither workflow reports, blocking the PR again) but annoying". That covers
# only ONE of the two ways the lists can disagree, and it is the harmless one:
#
#   in paths-ignore, not in backend-ci.paths  -> neither runs; PR blocked. LOUD.
#   in NEITHER list                           -> backend-ci skips, the shim runs
#                                                (the path is outside its ignore
#                                                list), and the shim publishes the
#                                                required contexts GREEN with no
#                                                build. SILENT — see #461.
#
# The second is not drift between the lists; it is a path both lists forgot, so
# reviewing them against each other cannot find it. Two were forgotten:
#
#   `scripts/**` — 37 Python files, 7 of them CI gates. And since the
#   mesh-session Noise interop test spawns `scripts/noise-conformance-peer.py`,
#   breaking that peer was a `scripts/`-only diff that merged green while
#   disabling the test depending on it.
#
#   THIS FILE — the shim was in no list at all, including its own. A PR editing
#   only the shim skipped the real build and was then approved by the shim's own
#   greens: the mechanism that publishes checks on behalf of a build that did not
#   run was exempt from that build, so it could validate its own alteration.
#
# One shared list closes both, because `paths` and `paths-ignore` read it with
# INVERSE meaning — the same entry that makes a workflow fire makes the other
# suppress:
#
#   file listed in backend-ci `paths`        -> real build FIRES
#   file listed in shim `paths-ignore`       -> shim SUPPRESSED
#
# The `.github/workflows/backend-ci.yml` line above is the pattern already in
# use: editing the real workflow runs the real build and is not treated as
# docs-only. The shim now sits beside it for the same reason.
name: Backend CI (docs-only shim)

on:
  pull_request:
    paths-ignore:
      - "admin/rust/**"
      - "scripts/**"
      - "PORTS.md"
      - "admin/contracts/claw-store/v1/claw-store-household-v1.json"
      - "admin/contracts/claw-store/v1/contract.json"
      - "claws/manifest.yml"
      - "admin/contracts/mobile-claw-vpn/v1/**"
      - "admin/contracts/owner-approval/v2/**"
      - ".env.example"
      - "install-nixos"
      - "nix/**"
      - "tests/install-nixos-test.sh"
      - "tests/nixos-install/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/backend-ci-docs-shim.yml"

# One run per workflow per ref. A new commit supersedes the old run instead of
# leaving it to burn a full build on code that no longer exists.
#
# `main` is deliberately exempt: the post-merge run on this branch is what
# caught 5b04e135, a direct push that broke compilation on both platforms.
# Cancelling it because someone pushed a branch would throw away the only
# signal that covers what landed.
concurrency:
  group: backend-ci-docs-shim-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test-linux:
    name: "Build & Test (Rust / Linux)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: No backend paths changed
        run: echo "No backend paths changed — the real job lives in backend-ci.yml"

  build-and-test-macos:
    name: "Build & Test (Rust / macOS)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: No backend paths changed
        run: echo "No backend paths changed — the real job lives in backend-ci.yml"

  no-bash-policy:
    name: "No-Bash Policy Check"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: No backend paths changed
        run: echo "No backend paths changed — the real job lives in backend-ci.yml"
