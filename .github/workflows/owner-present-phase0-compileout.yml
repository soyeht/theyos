name: Owner-Present Phase 0 Compile-Out

# The artifact jobs use the same canonical recipe as the three release paths.
# This is a target/build-graph proof plus an executable artifact contract; the
# strings pass remains only an auxiliary tripwire.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-route-composer:
    name: Test the exact Phase 0 route composer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout theyos
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Exercise the exact Phase 0 route composer
        working-directory: admin/rust
        run: |
          cargo test --locked -p server-rs mobile_claw_vpn_phase0
          cargo test --locked -p server-rs --test claw_store_wire_contract phase0_

  published-artifact:
    name: Published-target candidate (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            tool: cross
            direct: "1"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            tool: cross
            direct: "0"
          - os: macos-15
            target: aarch64-apple-darwin
            tool: cargo
            direct: "1"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout theyos
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Isolate Phase 0 Rust toolchain
        shell: bash
        run: |
          phase0_home="${RUNNER_TEMP}/phase0-rust-home"
          rm -rf "${phase0_home}"
          install -d -m 700 "${phase0_home}"
          printf 'HOME=%s\n' "${phase0_home}" >> "${GITHUB_ENV}"
          printf 'RUSTUP_HOME=%s/.rustup\n' "${phase0_home}" >> "${GITHUB_ENV}"
          printf 'CARGO_HOME=%s/.cargo\n' "${phase0_home}" >> "${GITHUB_ENV}"

      - name: Setup pinned Rust toolchain
        uses: dtolnay/rust-toolchain@5a814b2e0f75e492da42a3c1227d52112e4dac50 # 1.92.0
        with:
          components: clippy
          targets: ${{ matrix.target }}

      - name: Enable aarch64 emulation
        if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Build, inspect, stage, and attest
        shell: bash
        env:
          CARGO_HOME: ""
          PHASE0_TARGET: ${{ matrix.target }}
          PHASE0_BUILD_TOOL: ${{ matrix.tool }}
          PHASE0_CARGO_TARGET_DIR: ${{ runner.temp }}/phase0-target-${{ matrix.target }}
          PHASE0_RUN_ARTIFACT_DIRECT: ${{ matrix.direct }}
          PHASE0_ATTESTATION_OUT: ${{ runner.temp }}/phase0-attestation-${{ matrix.target }}.json
          PHASE0_STAGED_ENGINE_OUT: ${{ runner.temp }}/theyos-engine-${{ matrix.target }}
          PHASE0_EXPECTED_XCODE_VERSION: "16.4"
          PHASE0_EXPECTED_XCODE_BUILD: "16F6"
          PHASE0_EXPECTED_MACOS_SDK_VERSION: "15.5"
          PHASE0_EXPECTED_DEVELOPER_DIR: "/Applications/Xcode_16.4.app/Contents/Developer"
        run: |
          env -u CARGO_HOME -u RUSTUP_HOME -u PHASE0_RUSTUP_HOME \
            bash .github/scripts/check-mobile-claw-vpn-owner-present-phase0-compileout.sh
          jq -e --arg target "${PHASE0_TARGET}" '
            .schema == "theyos-owner-present-phase0-artifact-attestation-v2"
            and .published_target == true
            and .target == $target
            and .server_equals_theyos_engine == true
            and .owner_present_authority == "none"
            and .build_environment_policy == "env-clear-positive-allowlist-v1"
            and .cargo_source_policy == "local-admin-rust-or-canonical-crates-io-v1"
            and .cargo_fetch_network == true
            and .post_fetch_build_offline == true
            and .closed_input_roots_path == ".github/owner-present-phase0-closed-input-roots-v1.txt"
            and (has("boundary_manifest_sha256") | not)
            and (.closed_input_objects | length >= 8)
            and (.closed_input_objects | map(.path) as $paths
              | ($paths | length) == ($paths | unique | length)
                and ([
                  "admin/rust",
                  "admin/contracts/claw-store/v1/contract.json",
                  "admin/contracts/mobile-claw-vpn/v1/owner_present_success_wire_v1.json",
                  "claws", "flake.lock", "flake.nix", "nix", "scripts"
                ] - $paths | length == 0))
            and all(.closed_input_objects[];
              (.path as $path
                | ($path | test("^[^/].*")) and ($path | contains("../") | not))
              and (.oid | test("^[0-9a-f]{40}$"))
              and ((.mode == "040000" and .type == "tree")
                or ((.mode == "100644" or .mode == "100755") and .type == "blob")))
            and (.rustc_toolchain_sha256 | test("^[0-9a-f]{64}$"))
            and (.cargo_toolchain_sha256 | test("^[0-9a-f]{64}$"))
            and (.toolchain_closure_sha256 | test("^[0-9a-f]{64}$"))
            and .toolchain_closure_policy == "rustup-package-payload-v1-excluding-bookkeeping-v1"
            and (.toolchain_root | test("^1\\.92\\.0-[0-9a-z_-]+$"))
            and (.toolchain_policy_sha256 | test("^[0-9a-f]{64}$"))
            and .toolchain_policy_target == $target
            and (if $target == "aarch64-apple-darwin"
                 then .expected_xcode_version == "16.4"
                   and .expected_xcode_build == "16F6"
                   and .expected_macos_sdk_version == "15.5"
                   and .developer_dir == "/Applications/Xcode_16.4.app/Contents/Developer"
                   and .macos_sdk_path == "/Applications/Xcode_16.4.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX15.5.sdk"
                 else true end)
          ' "${PHASE0_ATTESTATION_OUT}"

      - name: Execute the aarch64 published artifact contract
        if: matrix.target == 'aarch64-unknown-linux-musl'
        shell: bash
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${RUNNER_TEMP}/theyos-engine-${{ matrix.target }}:/engine:ro" \
            --entrypoint /engine \
            alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc \
            --owner-present-phase0-contract \
            | jq -e '
                .authority == "none"
                and .production_activation == false
                and .third_target_injection_seam_compiled == false
                and .generic_ip_tunnel_backend_compiled == false
                and .generic_ip_tunnel_store_accepts_resource == false
                and .generic_ip_tunnel_env_accepts_resource == false
                and .declared_product_a_routes == ["/claw-vpn/status"]
              '

      - name: Publish Phase 0 attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: owner-present-phase0-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/phase0-attestation-${{ matrix.target }}.json
            ${{ runner.temp }}/theyos-engine-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30

  attest-published-artifact:
    name: Attest Phase 0 candidate (${{ matrix.target }})
    if: github.event_name == 'push'
    needs: published-artifact
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - aarch64-apple-darwin
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the inspected engine and manifest
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: owner-present-phase0-${{ matrix.target }}
          path: subject

      - name: Verify the attestation subject
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          manifest="subject/phase0-attestation-${TARGET}.json"
          engine="subject/theyos-engine-${TARGET}"
          test -f "$manifest"
          test -f "$engine"
          test "$(jq -r '.source_sha' "$manifest")" = "$GITHUB_SHA"
          test "$(jq -r '.target' "$manifest")" = "$TARGET"
          test "$(jq -r '.published_target' "$manifest")" = "true"
          test "$(sha256sum "$engine" | awk '{print $1}')" = \
            "$(jq -r '.theyos_engine_sha256' "$manifest")"

      - name: Sign GitHub build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: subject/theyos-engine-${{ matrix.target }}
