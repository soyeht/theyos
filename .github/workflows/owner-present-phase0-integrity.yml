name: Owner-Present Phase 0 Authority Integrity

# The trusted base workflow reads the PR object but never checks out or
# executes code from the PR head.
on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

# One run per workflow per ref. A new commit supersedes the old run instead of
# leaving it to burn a full build on code that no longer exists.
#
# `main` is deliberately exempt: the post-merge run on this branch is what
# caught 5b04e135, a direct push that broke compilation on both platforms.
# Cancelling it because someone pushed a branch would throw away the only
# signal that covers what landed.
concurrency:
  group: owner-present-phase0-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  base-owned-integrity:
    name: Owner-present base-owned integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Compare protected authority objects
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/test-mobile-claw-vpn-owner-present-phase0-integrity.sh
          bash .github/scripts/check-mobile-claw-vpn-owner-present-phase0-integrity.sh \
            "${GITHUB_WORKSPACE}" \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            "${{ github.event.pull_request.number }}"
