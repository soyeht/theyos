name: Owner-Present Phase 0 Authority Integrity

# The trusted base workflow reads PR objects but never checks out or executes
# code from the PR head.
on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed
  merge_group:
    branches:
      - main
    types:
      - checks_requested

permissions:
  contents: read
  pull-requests: read

# One run per workflow per ref. A new commit supersedes the old run instead of
# leaving it to burn a full build on code that no longer exists.
#
# `main` is deliberately exempt: the post-merge run on this branch is what
# caught 5b04e135, a direct push that broke compilation on both platforms.
# Cancelling it because someone pushed a branch would throw away the only
# signal that covers what landed.
concurrency:
  group: owner-present-phase0-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  base-owned-integrity:
    name: Owner-present base-owned integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Compare protected authority objects
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/test-mobile-claw-vpn-owner-present-phase0-integrity.sh
          if [[ "${GITHUB_EVENT_NAME}" == "merge_group" ]]; then
            base_sha="$(jq -er '.merge_group.base_sha' "${GITHUB_EVENT_PATH}")"
            group_sha="$(jq -er '.merge_group.head_sha' "${GITHUB_EVENT_PATH}")"
            [[ "${base_sha}" =~ ^[0-9a-f]{40}$ && "${group_sha}" =~ ^[0-9a-f]{40}$ ]] \
              || { echo "::error::merge-group event has invalid base/head SHA"; exit 1; }
            pulls_dir="${RUNNER_TEMP}/phase0-merge-group-pulls"
            mkdir -p "${pulls_dir}"
            page=1
            while :; do
              page_file="${pulls_dir}/page-${page}.json"
              /usr/bin/curl --fail --silent --show-error --location --max-time 20 \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${group_sha}/pulls?per_page=100&page=${page}" \
                >"${page_file}" \
                || { echo "::error::could not resolve merge-group pull requests"; exit 1; }
              jq -e 'type == "array"' "${page_file}" >/dev/null \
                || { echo "::error::merge-group pull request response is invalid"; exit 1; }
              page_count="$(jq -er 'length' "${page_file}")"
              (( page_count <= 100 )) \
                || { echo "::error::merge-group pull request page is too large"; exit 1; }
              (( page_count < 100 )) && break
              (( page >= 1000 )) \
                && { echo "::error::merge-group pull request pagination exceeded the limit"; exit 1; }
              page=$((page + 1))
            done
            pulls_file="${RUNNER_TEMP}/phase0-merge-group-pulls.json"
            jq -s 'add' "${pulls_dir}"/page-*.json >"${pulls_file}"
            pull_count="$(jq -er 'length' "${pulls_file}")"
            (( pull_count > 0 )) \
              || { echo "::error::merge-group contains no associated pull request"; exit 1; }
            while IFS=$'\t' read -r pr_number head_sha pr_base_sha; do
              [[ "${pr_number}" =~ ^[1-9][0-9]*$ \
                && "${head_sha}" =~ ^[0-9a-f]{40}$ \
                && "${pr_base_sha}" == "${base_sha}" ]] \
                || { echo "::error::merge-group pull request identity is invalid"; exit 1; }
              PHASE0_INTEGRITY_MERGE_GROUP=1 \
              PHASE0_INTEGRITY_MERGE_GROUP_SHA="${group_sha}" \
              PHASE0_INTEGRITY_MERGE_GROUP_BASE_SHA="${base_sha}" \
                bash .github/scripts/check-mobile-claw-vpn-owner-present-phase0-integrity.sh \
                  "${GITHUB_WORKSPACE}" "${base_sha}" "${head_sha}" "${pr_number}"
            done < <(jq -r '.[] | [.number, .head.sha, .base.sha] | @tsv' "${pulls_file}")
          else
            bash .github/scripts/check-mobile-claw-vpn-owner-present-phase0-integrity.sh \
              "${GITHUB_WORKSPACE}" \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" \
              "${{ github.event.pull_request.number }}"
          fi
