name: Release (macOS)

# Release authority is tag-only. A tag must already be an ancestor of main;
# workflow_dispatch is intentionally absent so a branch ref cannot be paired
# with a different tag input.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-unsigned-macos:
    name: Build and attest unsigned macOS subjects
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_name }}
      PHASE0_TARGET: aarch64-apple-darwin
      PHASE0_BUILD_TOOL: cargo
      PHASE0_ATTESTATION: ${{ runner.temp }}/phase0-attestation-aarch64-apple-darwin.json
      PHASE0_ENGINE: ${{ runner.temp }}/theyos-engine-aarch64-apple-darwin
      PHASE0_EXPECTED_XCODE_VERSION: "16.4"
      PHASE0_EXPECTED_XCODE_BUILD: "16F6"
      PHASE0_EXPECTED_MACOS_SDK_VERSION: "15.5"
      PHASE0_EXPECTED_DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      PHASE0_STAGED_BINARIES_OUT: ${{ runner.temp }}/phase0-binaries

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify attested source identity
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$TAG" = "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Setup pinned Rust
        uses: dtolnay/rust-toolchain@5a814b2e0f75e492da42a3c1227d52112e4dac50
        with:
          targets: aarch64-apple-darwin

      - name: Verify tag matches Cargo version
        run: |
          set -euo pipefail
          version="$(git show "$GITHUB_SHA:admin/rust/soyeht-rs/Cargo.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)"
          test "$TAG" = "v$version"

      - name: Build, inspect, and attest unsigned subjects
        shell: bash
        env:
          PHASE0_CARGO_TARGET_DIR: ${{ runner.temp }}/phase0-target
          PHASE0_CARGO_HOME: ${{ runner.temp }}/phase0-cargo-home/home
          PHASE0_RUN_ARTIFACT_DIRECT: "1"
          PHASE0_ATTESTATION_OUT: ${{ runner.temp }}/phase0-attestation-aarch64-apple-darwin.json
          PHASE0_STAGED_ENGINE_OUT: ${{ runner.temp }}/theyos-engine-aarch64-apple-darwin
        run: |
          set -euo pipefail
          rm -rf "$PHASE0_CARGO_TARGET_DIR" "$PHASE0_CARGO_HOME"
          mkdir -p "$PHASE0_CARGO_TARGET_DIR" "$PHASE0_CARGO_HOME"
          bash .github/scripts/check-mobile-claw-vpn-owner-present-phase0-compileout.sh

      - name: Package exact unsigned subjects
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' admin/rust/soyeht-rs/Cargo.toml | head -1)"
          stage="$RUNNER_TEMP/macos-unsigned/stage"
          rm -rf "$RUNNER_TEMP/macos-unsigned"
          mkdir -p "$stage"
          binary_dir="$PHASE0_STAGED_BINARIES_OUT"
          cp "$PHASE0_ENGINE" "$stage/theyos-engine"
          for executable in vmrunner_macos_ipc store-ipc terminal-ipc theyos-ssh theyos-provision-inject; do
            cp "$binary_dir/$executable" "$stage/$executable"
          done
          git show "$GITHUB_SHA:scripts/entitlements/vmrunner-macos.entitlements" > "$stage/vmrunner-macos.entitlements"
          printf '%s\n' "$version" > "$stage/engine-version.txt"
          cp "$PHASE0_ATTESTATION" "$stage/phase0-build-attestation.json"
          for executable in theyos-engine vmrunner_macos_ipc store-ipc terminal-ipc theyos-ssh theyos-provision-inject; do
            actual="$(shasum -a 256 "$stage/$executable" | awk '{print $1}')"
            expected="$(jq -r --arg executable "$executable" '.published_executables[$executable].sha256' "$PHASE0_ATTESTATION")"
            test "$actual" = "$expected"
          done
          jq -S \
            --arg schema "theyos-phase0-published-package-manifest-v1" \
            --arg version "$version" \
            --arg phase0_attestation_sha256 "$(shasum -a 256 "$PHASE0_ATTESTATION" | awk '{print $1}')" \
            --arg entitlements_sha256 "$(shasum -a 256 "$stage/vmrunner-macos.entitlements" | awk '{print $1}')" \
            --argjson names '["theyos-engine","vmrunner_macos_ipc","store-ipc","terminal-ipc","theyos-ssh","theyos-provision-inject"]' \
            '{schema:$schema,version:$version,source_sha,source_tree,target,phase0_attestation_sha256:$phase0_attestation_sha256,executables:(.published_executables | with_entries(select(.key as $key | $names | index($key))) | with_entries(.value = {unsigned_sha256:.value.sha256,classification:.value.classification})),package_files:{"vmrunner-macos.entitlements":{unsigned_sha256:$entitlements_sha256,classification:"codesign-input-entitlements"}}}' \
            "$PHASE0_ATTESTATION" > "$stage/phase0-package-manifest.json"
          tar -C "$stage" -czf "$RUNNER_TEMP/macos-unsigned/theyos-engine-$version-macos-arm64-unsigned.tar.gz" .

      - name: Upload unsigned subject only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-unsigned-phase0-subject
          path: ${{ runner.temp }}/macos-unsigned
          if-no-files-found: error

  sign-and-publish-macos:
    name: Sign, notarize, and publish final macOS subject
    needs: build-unsigned-macos
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}

    steps:
      - name: Download unsigned subject
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-unsigned-phase0-subject
          path: unsigned

      - name: Verify unsigned subject and import signing certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          stage="unsigned/stage"
          test -x "$stage/theyos-engine"
          test -f "$stage/phase0-build-attestation.json"
          test -f "$stage/phase0-package-manifest.json"
          jq -e '
            .expected_xcode_version == "16.4"
            and .expected_xcode_build == "16F6"
            and .expected_macos_sdk_version == "15.5"
            and .developer_dir == "/Applications/Xcode_16.4.app/Contents/Developer"
            and .macos_sdk_path == "/Applications/Xcode_16.4.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX15.5.sdk"
          ' "$stage/phase0-build-attestation.json" >/dev/null
          while IFS=$'\t' read -r executable expected; do
            test -n "$executable"
            test "$(shasum -a 256 "$stage/$executable" | awk '{print $1}')" = "$expected"
          done < <(jq -r '.executables | to_entries[] | [.key,.value.unsigned_sha256] | @tsv' "$stage/phase0-package-manifest.json")
          test "$(shasum -a 256 "$stage/vmrunner-macos.entitlements" | awk '{print $1}')" = \
            "$(jq -r '.package_files["vmrunner-macos.entitlements"].unsigned_sha256' "$stage/phase0-package-manifest.json")"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"
          security default-keychain -s "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"
          security set-keychain-settings -lut 1800 "$RUNNER_TEMP/build.keychain"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$RUNNER_TEMP/build.keychain" -P "$P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Sign only downloaded unsigned subjects
        shell: bash
        run: |
          set -euo pipefail
          stage="unsigned/stage"
          codesign_one() {
            local name="$1" identifier="$2"
            local args=(--force --options runtime --timestamp --identifier "$identifier" --sign "$CODESIGN_IDENTITY")
            if [ "$name" = vmrunner_macos_ipc ]; then
              args+=(--entitlements "$stage/vmrunner-macos.entitlements")
            fi
            codesign "${args[@]}" "$stage/$name"
            codesign --verify --strict --verbose=2 "$stage/$name"
          }
          codesign_one theyos-engine com.soyeht.theyos.theyos-engine
          codesign_one theyos-ssh com.soyeht.theyos.theyos-ssh
          codesign_one store-ipc com.soyeht.theyos.store-ipc
          codesign_one terminal-ipc com.soyeht.theyos.terminal-ipc
          codesign_one vmrunner_macos_ipc com.soyeht.theyos.vmrunner_macos_ipc
          codesign_one theyos-provision-inject com.soyeht.theyos.theyos-provision-inject

      - name: Notarize signed subject
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          chmod 600 "$RUNNER_TEMP/notary-key.p8"
          ditto -c -k --keepParent unsigned/stage "$RUNNER_TEMP/theyos-macos-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/theyos-macos-notarize.zip" \
            --key "$RUNNER_TEMP/notary-key.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/theyos-macos-notarize.zip"

      - name: Package and bind final signed bytes
        id: package
        shell: bash
        run: |
          set -euo pipefail
          stage="unsigned/stage"
          version="$(cat "$stage/engine-version.txt")"
          for executable in theyos-engine vmrunner_macos_ipc store-ipc terminal-ipc theyos-ssh theyos-provision-inject; do
            signed="$(shasum -a 256 "$stage/$executable" | awk '{print $1}')"
            jq -S --arg executable "$executable" --arg signed "$signed" \
              '.executables[$executable].signed_sha256 = $signed' \
              "$stage/phase0-package-manifest.json" > "$stage/phase0-package-manifest.next.json"
            mv "$stage/phase0-package-manifest.next.json" "$stage/phase0-package-manifest.json"
          done
          tar -C "$stage" -czf "theyos-engine-$version-macos-arm64.tar.gz" .
          package_sha256="$(shasum -a 256 "theyos-engine-$version-macos-arm64.tar.gz" | awk '{print $1}')"
          jq -n -S \
            --arg schema "theyos-engine-release-provenance-v2" \
            --arg source_sha "$(jq -r '.source_sha' "$stage/phase0-build-attestation.json")" \
            --arg source_tree "$(jq -r '.source_tree' "$stage/phase0-build-attestation.json")" \
            --arg phase0_manifest_sha256 "$(shasum -a 256 "$stage/phase0-package-manifest.json" | awk '{print $1}')" \
            --arg published_signed_engine_sha256 "$(shasum -a 256 "$stage/theyos-engine" | awk '{print $1}')" \
            --arg package_sha256 "$package_sha256" \
            '{schema:$schema,source_sha:$source_sha,source_tree:$source_tree,phase0_package_manifest_sha256:$phase0_manifest_sha256,published_signed_engine_sha256:$published_signed_engine_sha256,final_package_sha256:$package_sha256,signing_job_has_source_checkout:false,signing_job_runs_cargo:false}' \
            > "theyos-engine-$version-macos-arm64.provenance.json"

      - name: Attest final signed package
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: theyos-engine-*-macos-arm64.tar.gz

      - name: Publish final package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat unsigned/stage/engine-version.txt)"
          package="theyos-engine-$version-macos-arm64.tar.gz"
          provenance="theyos-engine-$version-macos-arm64.provenance.json"
          phase0="unsigned/stage/phase0-build-attestation.json"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$package" "$provenance" "$phase0#theyos-engine-$version-macos-arm64.phase0.json" --clobber
          else
            gh release create "$TAG" --title "$TAG" --notes "Automated release. Final macOS package SHA256: $(shasum -a 256 "$package" | awk '{print $1}')" \
              "$package" "$provenance" "$phase0#theyos-engine-$version-macos-arm64.phase0.json"
          fi

      - name: Cleanup signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain" 2>/dev/null || true

  update-homebrew-formula:
    name: Update Homebrew formula through a normal PR
    needs: sign-and-publish-macos
    runs-on: macos-15
    permissions:
      contents: write
      pull-requests: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout main for formula generation
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Generate formula
        run: ./scripts/generate-brew-formula.sh
      - name: Open formula PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name theyos-release-bot
          git config user.email release@soyeht.invalid
          branch="release/formula-$TAG"
          git checkout -B "$branch" origin/main
          git add homebrew/Formula/theyos.rb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "release: update brew formula for $TAG"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "release: update brew formula for $TAG" --body "Generated after the signed and notarized $TAG package was published."
