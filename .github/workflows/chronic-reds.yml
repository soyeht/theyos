name: Chronic Reds

# Phase 3.5 of the CI plan: every chronic red on `main` has an owner and an
# expiry, or the gate pages on it. This is the "red on the screen with nobody
# behind it" failure mode -- a check that lingers red teaches ignore-by-default,
# and a periodic report nobody reads is hidden red, not resolved.
#
# The gate (scripts/check-chronic-reds.py) reads declarations from
# scripts/chronic-reds-enrollment.json. A failing check matched there (and
# before its expiry) is DECLARED. A failing check NOT matched is ORPHAN, and the
# gate opens (or re-pings) a deduped GitHub issue carrying an assignee and a
# deadline -- the issue IS the forced declaration; the owner is paged, not the
# report read. Re-ping fires every 24h while the orphan persists; an orphan
# issue is auto-closed when its check goes green.
#
# NOT A REQUIRED CHECK, and the blocking tooth (promote a check to required
# after its expiry) is a DECLARED admin escalation -- this gate never edits
# branch protection. It reports and pages.
#
# Runs in DRY-RUN on pull_request (so an unmerged PR's CI does not page on
# main's reds) and in WRITE mode on push to main and on the daily clock (the
# 24h re-ping heartbeat).

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "11 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: chronic-reds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  chronic-reds:
    name: Chronic-red owner/date gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout theyos
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # DRY-RUN on PR (detect + show intended pages, but write nothing); WRITE
      # on main push and on the clock. The decision logic is identical either
      # way; --dry-run only suppresses the GitHub writes.
      - name: Gate — chronic reds
        id: gate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(--repo "${{ github.repository }}")
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            args+=(--dry-run)
          fi
          uv run scripts/check-chronic-reds.py "${args[@]}"

      - name: Gate self-tests
        id: selftest
        continue-on-error: true
        run: uv run scripts/test_check_chronic_reds.py

      - name: Summary
        if: always()
        run: |
          {
            echo "| gate | outcome |"
            echo "|---|---|"
            echo "| chronic reds | ${{ steps.gate.outcome }} |"
            echo "| chronic-red self-tests | ${{ steps.selftest.outcome }} |"
            echo ""
            echo "PR runs are DRY-RUN (no pages); push/schedule runs WRITE issues."
            echo "ORPHAN = a failing check with no owner+date declaration -> paged."
            echo "EXPIRED = a declaration past its expiry -> reported."
            echo "This check is NOT required; it reports and pages."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the job if a gate went red
        if: always()
        run: |
          failed=""
          [ "${{ steps.gate.outcome }}" = "failure" ] && failed="${failed} chronic-reds"
          [ "${{ steps.selftest.outcome }}" = "failure" ] && failed="${failed} chronic-reds-selftests"
          if [ -n "${failed}" ]; then
            echo "::error::red gates:${failed} — see the step logs and the job summary. This check is not required; it reports and pages."
            exit 1
          fi
          echo "chronic-reds gate + self-tests green"
